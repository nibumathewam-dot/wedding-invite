<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding</title>

<style>
body {
  margin: 0;
  overflow: hidden;
}

/* full screen video */
video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
</style>

</head>

<body>

<video autoplay muted playsinline id="vid">
  <source src="opening.mp4" type="video/mp4">
</video>

<script>
// go to next page when video ends
document.getElementById("vid").onended = function() {
  window.location.href = "details.html";
};

// backup (in case autoplay fails)
setTimeout(function(){
  window.location.href = "details.html";
}, 6000);
</script>

</body>
</html>
