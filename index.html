<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: black;
  overflow: hidden;
}

/* BACKGROUND SYSTEM */
.bg {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
}

/* BLUR IMAGE */
.bg-blur {
  position: absolute;
  width: 100%;
  height: 100%;
  background: url('images/FandH.jpg') center/cover no-repeat;
  filter: blur(25px);
  transform: scale(1.3);
  transition: all 2s ease;
}

/* CLEAR IMAGE */
.bg-clear {
  position: absolute;
  width: 100%;
  height: 100%;
  background: url('images/FandH.jpg') center/contain no-repeat;
  background-color: black;
  opacity: 0;
  transition: opacity 2s ease;
}

/* AFTER DOOR OPEN */
.clearView .bg-blur {
  filter: blur(0);
  transform: scale(1);
}

.clearView .bg-clear {
  opacity: 1;
}

/* TEXT */
.inviteContent {
  position: absolute;
  width: 100%;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  z-index: 2;
}

.inviteText {
  color: white;
  font-size: 2em;
  border-right: 3px solid white;
  white-space: nowrap;
  overflow: hidden;
  width: 0;
  margin: auto;
  animation: typing 3s steps(30,end) forwards, blink .7s infinite;
}

@keyframes typing { from {width:0} to {width:100%} }
@keyframes blink { 50%{border-color:transparent} }

/* DOOR */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  z-index: 999;
  perspective: 1200px;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  background: rgba(255,255,255,0.5);
  backdrop-filter: blur(8px);
  transition: transform 2s ease;
}

.left { left:0; transform-origin:left; }
.right { right:0; transform-origin:right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

/* PETALS */
#petalContainer {
  position: fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index: 1000;
}

.petal {
  position:absolute;
  background:url('images/petal.png') center/contain no-repeat;
  width:20px;
  height:20px;
  animation:fall linear forwards;
}

@keyframes fall {
  0% { transform: translateY(-10vh) rotate(0deg); }
  100% { transform: translateY(110vh) rotate(360deg); }
}

/* SECTION */
section {
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.overlay {
  background: rgba(255,255,255,0.8);
  padding: 20px;
  border-radius: 15px;
  text-align:center;
}

h1 { color:#b8962e; }

.rsvp-btn {
  margin-top:15px;
  padding:10px 20px;
  background:#b8962e;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" src="music.mp3" loop></audio>

<!-- INTRO -->
<div id="inviteIntro" class="bg">
  <div class="bg-blur"></div>
  <div class="bg-clear"></div>

  <div class="inviteContent">
    <h1 class="inviteText">You are exclusively invited 💍</h1>
  </div>
</div>

<!-- DOOR -->
<div id="doorIntro" class="bg">
  <div class="bg-blur"></div>
  <div class="bg-clear"></div>

  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
</div>

<!-- PETALS -->
<div id="petalContainer"></div>

<!-- HERO -->
<section class="bg">
  <div class="bg-blur"></div>
  <div class="bg-clear"></div>

  <div class="overlay">
    <h1>Fathima 💍 Habeeb</h1>
    <p>Are Getting Married ✨</p>
    <button onclick="openRSVP()" class="rsvp-btn">RSVP 💌</button>
  </div>
</section>

<script>
const inviteIntro = document.getElementById("inviteIntro");
const doorIntro = document.getElementById("doorIntro");
const music = document.getElementById("music");
const petalContainer = document.getElementById("petalContainer");

/* MUSIC FIX (mobile safe) */
document.body.addEventListener("click", () => {
  music.play().catch(()=>{});
}, { once:true });

/* INTRO */
window.onload = ()=>{
  setTimeout(()=>{
    inviteIntro.style.display="none";
  },4000);
};

/* DOOR + CLEAR */
function openDoor(){
  doorIntro.classList.add("open");

  document.querySelectorAll(".bg").forEach(el=>{
    el.classList.add("clearView");
  });

  startPetals();

  setTimeout(()=>{
    doorIntro.style.display="none";
    document.body.style.overflow="auto";
  },2000);
}

/* PETALS */
function createPetal(){
  const p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";
  p.style.width=(15+Math.random()*20)+"px";
  p.style.height=p.style.width;
  p.style.animationDuration=(3+Math.random()*3)+"s";

  petalContainer.appendChild(p);
  setTimeout(()=>p.remove(),6000);
}

function startPetals(){
  let interval=setInterval(createPetal,200);
  setTimeout(()=>clearInterval(interval),15000);
}

/* RSVP */
function openRSVP(){
  window.open("rsvp.html","RSVP","width=420,height=650");
}
</script>

</body>
</html>
