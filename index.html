<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invite</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
}

/* ✅ BACKGROUND */
#bg{
  position:fixed;
  width:100%;
  height:100vh;
  background:url('images/FandH.jpg') center/cover no-repeat;

  filter:blur(15px);
  transform:scale(1.1);
  transition:2s ease;

  z-index:1;
}

/* ✅ TEXT */
#text{
  position:absolute;
  top:45%;
  width:100%;
  text-align:center;
  color:white;
  z-index:100;
}

/* ✅ SLOW TYPING */
.typing{
  display:inline-block;
  font-size:28px;
  white-space:nowrap;
  overflow:hidden;
  border-right:3px solid white;

  max-width:0;

  animation:
    typing 5s steps(30,end) forwards,
    blink 0.7s step-end 5,
    hideCursor 0.1s forwards 5s;
}

@keyframes typing{
  from{ max-width:0 }
  to{ max-width:100% }
}

@keyframes blink{
  50%{ border-color:transparent }
}

@keyframes hideCursor{
  to{ border-right:none }
}

/* ✅ GOLD ROUND BUTTON */
#btn{
  position:absolute;
  top:62%;
  left:50%;
  transform:translateX(-50%);

  width:130px;
  height:130px;
  border-radius:50%;

  border:none;
  cursor:pointer;

  background: radial-gradient(circle, #ffd700, #b8962e);
  color:white;

  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;

  font-size:14px;
  z-index:100;

  opacity:0;
}

/* ✅ BUTTON ANIMATION */
.showBtn{
  animation:
    fadeIn 1s forwards,
    pulse 1.6s infinite,
    glow 2s infinite;
}

@keyframes fadeIn{
  to{ opacity:1; }
}

@keyframes pulse{
  0%{ transform:translateX(-50%) scale(1); }
  50%{ transform:translateX(-50%) scale(1.12); }
  100%{ transform:translateX(-50%) scale(1); }
}

@keyframes glow{
  0%{ box-shadow:0 0 10px #b8962e; }
  50%{ box-shadow:0 0 40px #ffd700; }
  100%{ box-shadow:0 0 10px #b8962e; }
}

/* ✅ REALISTIC DOOR */
#door{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  z-index:10;

  perspective:1400px;
}

.side{
  width:50%;
  height:100%;

  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(8px);

  box-shadow: inset -5px 0 20px rgba(0,0,0,0.5);

  transition:transform 2s cubic-bezier(0.7,0,0.3,1);
}

.left{
  transform-origin:left;
}

.right{
  transform-origin:right;
}

.open .left{
  transform:rotateY(-110deg) translateZ(20px);
}

.open .right{
  transform:rotateY(110deg) translateZ(20px);
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div id="bg"></div>

<!-- TEXT -->
<div id="text">
  <span class="typing">You are exclusively invited 💍</span>
</div>

<!-- BUTTON -->
<button id="btn" onclick="openDoor()">
  Tap<br>to Open 💍
</button>

<!-- DOOR -->
<div id="door">
  <div class="side left"></div>
  <div class="side right"></div>
</div>

<script>
const btn = document.getElementById("btn");

/* ✅ SHOW BUTTON AFTER TYPING */
setTimeout(()=>{
  btn.classList.add("showBtn");
},5200);

/* ✅ OPEN DOOR */
function openDoor(){

  btn.classList.remove("showBtn");

  document.getElementById("door").classList.add("open");

  /* ✅ SMOOTH BACKGROUND REVEAL */
  document.getElementById("bg").style.filter = "blur(0)";
  document.getElementById("bg").style.transform = "scale(1)";

  document.getElementById("text").style.display="none";
  btn.style.display="none";

  setTimeout(()=>{
    document.getElementById("door").style.display="none";
  },2000);
}
</script>

</body>
</html>
