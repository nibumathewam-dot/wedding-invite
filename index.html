<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathu 💍 Kettiyon Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fffaf5;
  color: #333;
  overflow: hidden;
  scroll-snap-type: y mandatory;
}

/* ===================== */
/* 🔥 FIXED SWIPE INTRO */
/* ===================== */
#introSwipe {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  background: black;
  z-index: 10000;
}

.swipeContainer {
  display: flex;
  height: 100%;
  width: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.card {
  flex: 0 0 100%;
  height: 100vh;
  scroll-snap-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
}

.overlayCard {
  background: rgba(0,0,0,0.45);
  padding: 25px;
  border-radius: 18px;
  max-width: 80%;
  color: white;
}

.overlayCard h1 {
  font-size: 2.2em;
  margin: 0;
}

.overlayCard p {
  margin-top: 10px;
}

/* ===================== */
/* DOOR */
/* ===================== */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  z-index: 999;
  perspective: 1200px;
  transition: opacity 1s;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(5px);
  transition: transform 2s ease;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

/* ===================== */
/* SECTIONS */
/* ===================== */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  scroll-snap-align: start;
  text-align: center;
  padding: 20px;
}

#hero {
  background: url('images/home.jpg') center/cover no-repeat;
}

.overlay {
  background: rgba(255,255,255,0.7);
  padding: 25px;
  border-radius: 15px;
  backdrop-filter: blur(6px);
}

/* TEXT */
h1 {
  font-family: 'Playfair Display';
  color: #b8962e;
}

/* BUTTONS */
button {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 2000;
  background: white;
  color: #b8962e;
  border: 1px solid #b8962e;
  padding: 10px;
  border-radius: 50%;
}

/* LINKS */
a {
  color: #b8962e;
  text-decoration: none;
  border: 1px solid #b8962e;
  padding: 10px 20px;
  margin-top: 10px;
  border-radius: 20px;
}
</style>
</head>

<body>

<!-- ===================== SWIPE INTRO (FIXED) ===================== -->
<div id="introSwipe">
  <div class="swipeContainer">

    <div class="card" style="background:url('images/home.jpg') center/cover;">
      <div class="overlayCard">
        <h1>💍 Welcome</h1>
        <p>Swipe to continue</p>
      </div>
    </div>

    <div class="card" style="background:#b8962e;">
      <div class="overlayCard">
        <h1>Pathu 💍 Kettiyon</h1>
        <p>Two souls, one journey</p>
      </div>
    </div>

    <div class="card" style="background:#fffaf5;">
      <div class="overlayCard">
        <h1 style="color:black;">Save The Date</h1>
        <p style="color:black;">May 26, 2026</p>
      </div>
    </div>

    <div class="card" style="background:#333;">
      <div class="overlayCard">
        <h1>📍 Venue</h1>
        <p>Bangalore Palace</p>
      </div>
    </div>

    <div class="card" style="background:#b8962e;">
      <div class="overlayCard">
        <h1>You’re Invited 💍</h1>
        <button onclick="enterWedding()" class="rsvpBtn">Enter Wedding</button>
      </div>
    </div>

  </div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button onclick="toggleMusic()">🔊</button>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
</div>

<!-- HERO -->
<section id="hero">
  <div class="overlay">
    <h1>Pathu 💍 Kettiyon</h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE -->
<section style="background:#fff;">
  <h1>Wedding</h1>
  <p>May 26, 2026</p>

  <a href="https://maps.google.com/?q=Bangalore+Palace" target="_blank">
    View Venue 📍
  </a>
</section>

<!-- COUNTDOWN -->
<section style="background:#fffaf5;">
  <h1>Countdown</h1>
  <p id="timer"></p>
</section>

<script>

/* SWIPE EXIT */
function enterWedding(){
  document.getElementById("introSwipe").style.display = "none";
  document.body.style.overflow = "auto";
}

/* DOOR */
function openDoor(){
  document.getElementById("doorIntro").classList.add("open");

  document.getElementById("music").play().catch(()=>{});

  setTimeout(()=>{
    document.getElementById("doorIntro").style.opacity="0";
  },1500);

  setTimeout(()=>{
    document.getElementById("doorIntro").style.display="none";
    document.body.style.overflow="auto";
  },2200);
}

/* MUSIC */
function toggleMusic(){
  let m=document.getElementById("music");
  m.muted = !m.muted;
}

/* COUNTDOWN */
const date = new Date("May 26, 2026 00:00:00").getTime();

setInterval(()=>{
  let now=new Date().getTime();
  let gap=date-now;

  let d=Math.floor(gap/(1000*60*60*24));

  document.getElementById("timer").innerHTML =
    `<span style="font-size:2.5em;color:#b8962e;">${d}</span> Days Left`;
},1000);

</script>

</body>
</html>
