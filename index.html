<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
  font-family:sans-serif;
}

/* BACKGROUND */
.bg{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* ✅ SMART IMAGE FIT (DESKTOP + MOBILE) */
.bg-blur, .bg-clear{
  position:absolute;
  width:100%;
  height:100%;
  background:url('images/FandH.jpg') 50% 30% / cover no-repeat;
  top:0;
  left:0;
}

/* ✅ DESKTOP OPTIMIZATION */
@media (min-width:1024px){
  .bg-blur, .bg-clear{
    background-position:center top;  /* ✅ show faces */
  }
}

.bg-blur{
  filter:blur(20px);
  transform:scale(1.1);
  transition:1.5s ease;
  z-index:1;
}

.bg-clear{
  opacity:0;
  transition:1.5s ease;
  z-index:2;
}

/* ✅ FIX DOUBLE IMAGE */
.clearView .bg-blur{
  opacity:0;
}

.clearView .bg-clear{
  opacity:1;
}

/* TEXT */
.inviteContent{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:100%;
  text-align:center;
  z-index:5;
  transition:0.6s;
}

.inviteText{
  color:white;
  font-size:clamp(1.5rem,6vw,2.5rem);
  border-right:3px solid white;
  white-space:nowrap;
  overflow:hidden;
  width:0;
  animation:typing 3s steps(30,end) forwards, blink .6s infinite;
}

@keyframes typing{
  from{width:0}
  to{width:90%}
}
@keyframes blink{
  50%{border-color:transparent}
}

/* DOOR */
#doorIntro{
  position:fixed;
  width:100%;
  height:100%;
  z-index:10;
  perspective:1500px;
}

.door{
  position:absolute;
  width:50%;
  height:100%;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(10px);
  transition:2s ease;
}

.left{ left:0; transform-origin:left;}
.right{ right:0; transform-origin:right;}

.open .left{ transform:rotateY(-110deg);}
.open .right{ transform:rotateY(110deg);}

/* PETALS */
#petalContainer{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:50;
}

.petal{
  position:absolute;
  background:url('images/petal.png') center/contain no-repeat;
  animation:fall linear forwards;
}

@keyframes fall{
  0%{transform:translateY(-10vh);}
  100%{transform:translateY(110vh);}
}

/* HERO */
section{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.overlay{
  background:rgba(255,255,255,0.85);
  padding:20px;
  border-radius:15px;
  text-align:center;
}
</style>
</head>

<body>

<!-- ✅ MUSIC -->
<audio id="music" preload="auto" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- INTRO -->
<div class="bg">
  <div class="bg-blur"></div>
  <div class="bg-clear"></div>

  <div class="inviteContent">
    <h1 class="inviteText">You are exclusively invited 💍</h1>
  </div>
</div>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left"></div>
  <div class="door right"></div>
</div>

<!-- PETALS -->
<div id="petalContainer"></div>

<!-- HERO -->
<section class="bg">
  <div class="bg-blur"></div>
  <div class="bg-clear"></div>

  <div class="overlay">
    <h1>Fathima 💍 Habeeb</h1>
  </div>
</section>

<script>
const content=document.querySelector(".inviteContent");
const door=document.getElementById("doorIntro");
const music=document.getElementById("music");
const petals=document.getElementById("petalContainer");

/* ENABLE SOUND */
document.body.addEventListener("click",()=>{
  music.play().catch(()=>{});
},{once:true});

/* FLOW */
window.onload=()=>{

  // fade text only
  setTimeout(()=>{
    content.style.opacity="0";
  },3000);

  // 2 sec pause
  setTimeout(()=>{
    openDoor();
  },5000);
};

/* DOOR */
function openDoor(){
  door.classList.add("open");

  document.querySelectorAll(".bg").forEach(bg=>{
    bg.classList.add("clearView");
  });

  music.play().catch(()=>{});
  startPetals();

  setTimeout(()=>{
    door.style.display="none";
    document.body.style.overflow="auto";
  },2000);
}

/* PETALS */
function createPetal(){
  const p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";

  let s=15+Math.random()*20;
  p.style.width=s+"px";
  p.style.height=s+"px";
  p.style.animationDuration=(3+Math.random()*3)+"s";

  petals.appendChild(p);
  setTimeout(()=>p.remove(),5000);
}

function startPetals(){
  let i=setInterval(createPetal,150);
  setTimeout(()=>clearInterval(i),15000);
}
</script>

</body>
</html>
