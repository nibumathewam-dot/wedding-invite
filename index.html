<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ✅ BASE */
body{
  margin:0;
  font-family:sans-serif;
  overflow:hidden;
  background:black;
  scroll-behavior:smooth;
}
body.scroll{ overflow-y:auto; }

.section{ height:100vh; }

/* ✅ IMAGE */
#imageContainer{
  position:fixed;
  width:100%;
  height:100vh;
  overflow:hidden;
  z-index:1;
}

#bgImg{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:blur(15px);
  transform:scale(1.05);
  transition:2s;
}
.clear{
  filter:blur(0)!important;
  transform:scale(1)!important;
}

/* ✅ TEXT */
#text{
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  color:white;
  z-index:3;
}

/* ✅ TYPING */
.typing{
  display:inline-block;
  font-size:26px;
  border-right:3px solid white;
  white-space:nowrap;
  overflow:hidden;
  max-width:0;

  animation:
    typing 5s steps(30,end) forwards,
    blink 0.7s step-end 6,
    hideCursor 0.1s forwards 5s;
}

@keyframes typing{
  from{max-width:0}
  to{max-width:100%}
}
@keyframes blink{50%{border-color:transparent}}
@keyframes hideCursor{to{border-right:none}}

/* ✅ COUPLE */
#coupleName{
  position:absolute;
  top:30%;
  left:50%;
  transform:translate(-50%,20px);
  text-align:center;
  color:#ffd700;
  padding:20px;
  border-radius:20px;
  background:rgba(255,255,255,0.1);
  opacity:0;
  z-index:3;
}

.tagline{ max-width:240px; margin:auto; }
.names{ font-size:30px; color:white; }

.showNames{
  animation:fadeIn 2s forwards;
}
@keyframes fadeIn{
  to{opacity:1; transform:translate(-50%,0);}
}

/* ✅ BUTTON */
#btn{
  position:absolute;
  top:62%;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:130px;
  border-radius:50%;
  border:none;

  background:radial-gradient(circle,#ffd700,#b8962e);
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
  z-index:4;
  opacity:0;
}

.showBtn{
  animation:fadeBtn 1s forwards,pulse 1.6s infinite;
}
@keyframes fadeBtn{to{opacity:1}}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.1)}}

/* ✅ DOOR */
#door{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  z-index:2;
}

.side{
  width:50%;
  height:100vh;
  background:rgba(255,255,255,0.2);
  transition:1.8s;
}
.left{transform-origin:left;}
.right{transform-origin:right;}

.open .left{transform:rotateY(-110deg);}
.open .right{transform:rotateY(110deg);}

/* ✅ STORY */
#story{
  height:100vh;
  background:#111;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  z-index:2;
}

.storyBox{
  max-width:600px;
  padding:20px;
  line-height:1.7;
}

/* ✅ 🌸 PETALS (FINAL FIX) */
#petalContainer{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:10;
}

.petal{
  position:absolute;
  width:25px;
  height:25px;

  /* ✅ ALWAYS VISIBLE fallback */
  background-color:red;

  /* ✅ REAL PETAL */
  background-image:url('images/petal.png');
  background-size:contain;
  background-repeat:no-repeat;
  background-position:center;

  opacity:0.9;

  animation:fall linear forwards;
}

@keyframes fall{
  0%{
    transform:translateY(-10vh) translateX(0) rotate(0deg);
  }
  50%{
    transform:translateY(50vh) translateX(25px) rotate(180deg);
  }
  100%{
    transform:translateY(110vh) translateX(-25px) rotate(360deg);
  }
}

/* ✅ MOBILE */
@media(max-width:768px){
  .names{font-size:26px;}
}

</style>
</head>

<body>

<div class="section">

<div id="imageContainer">
  <img id="bgImg" src="images/FandH.jpg">
</div>

<div id="text">
  <span class="typing">You are exclusively invited 💍</span>
</div>

<div id="coupleName">
  <div class="tagline">We are getting<br>married 💍</div>
  <div class="names">Fathima ❤️ Habeeb</div>
</div>

<button id="btn" onclick="openDoor()">Tap<br>to Open 💍</button>

<div id="door">
  <div class="side left"></div>
  <div class="side right"></div>
</div>

</div>

<div id="story">
<div class="storyBox">
<h2>Our Story 💫</h2>
<p>Every love story has a beginning… ours began with a simple moment.</p>
<p>Through smiles and memories, we found something beautiful.</p>
<p>Now we step into forever together 💖</p>
<p><b>Join us 💍</b></p>
</div>
</div>

<div id="petalContainer"></div>

<audio id="music" src="music.mp3" loop></audio>

<script>

const btn=document.getElementById("btn");
const img=document.getElementById("bgImg");
const petals=document.getElementById("petalContainer");
const music=document.getElementById("music");

/* ✅ SHOW BUTTON */
document.querySelector(".typing").addEventListener("animationend",()=>{
  btn.classList.add("showBtn");
});

/* ✅ OPEN */
function openDoor(){

  music.play().catch(()=>{});

  document.getElementById("door").classList.add("open");
  img.classList.add("clear");

  document.body.classList.add("scroll");

  document.getElementById("text").style.display="none";
  btn.style.display="none";

  document.getElementById("coupleName").classList.add("showNames");

  startPetals();
}

/* ✅ 🌸 PETALS */
let interval;

function createPetal(){

  let p=document.createElement("div");
  p.className="petal";

  p.style.left=Math.random()*100+"vw";

  let size=15+Math.random()*20;
  p.style.width=size+"px";
  p.style.height=size+"px";

  let duration=4+Math.random()*3;
  p.style.animationDuration=duration+"s";

  petals.appendChild(p);

  setTimeout(()=>p.remove(),duration*1000);
}

function startPetals(){
  if(interval) return;
  interval=setInterval(createPetal,180);
}

</script>

</body>
</html>
