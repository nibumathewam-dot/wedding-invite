<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: #e8dcc7;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: serif;
}

/* FULL SCREEN SPACE */
.scene {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  perspective: 1500px;
}

/* CARD (NOW FULLSCREEN RESPONSIVE) */
.card {
  position: relative;

  width: min(95vw, 500px);
  height: calc(min(95vw, 500px) * 1.3);

  max-height: 90vh;

  background: url('https://raw.githubusercontent.com/nibumathewam-dot/wedding-invite/main/images/F_H.png') center/cover no-repeat;

  border-radius: 20px;
  box-shadow: 0 30px 70px rgba(0,0,0,0.35);
  overflow: hidden;

  transform-style: preserve-3d;
}

/* FLAP */
.flap {
  position: absolute;
  width: 100%;
  height: 50%;
  background: inherit;

  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top;
  transition: transform 1s ease;
  z-index: 3;
}

/* SEAL */
.seal {
  position: absolute;
  bottom: 28%;
  left: 50%;
  transform: translateX(-50%);

  width: 90px;
  height: 90px;

  background: radial-gradient(circle, #d4af37, #b8962e);
  border-radius: 50%;

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 26px;
  font-weight: bold;
  cursor: pointer;

  z-index: 4;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

/* INNER CARD */
.inner {
  position: absolute;
  width: 88%;
  height: 80%;
  left: 6%;
  bottom: 0;

  background: #fffaf5;
  border-radius: 15px;
  padding: 25px;

  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;

  box-shadow: 0 20px 50px rgba(0,0,0,0.25);

  transform: translateY(100%) rotateX(35deg) scale(0.9);
  transition: transform 1.2s ease;
}

/* TEXT */
.inner h2 {
  color: #b8962e;
  margin-bottom: 10px;
  font-size: 1.6em;
}

.inner p {
  color: #555;
  font-size: 1em;
}

/* OPEN ANIMATION */
.open .flap {
  transform: rotateX(180deg);
}

.open .inner {
  transform: translateY(-15%) rotateX(0deg) scale(1);
}

.open .seal {
  opacity: 0;
  transform: translateX(-50%) scale(0.6);
}

/* MOBILE PERFECT FIT */
@media (max-width: 500px) {
  .card {
    width: 95vw;
    height: 80vh;
  }

  .seal {
    width: 70px;
    height: 70px;
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="scene">
  <div class="card" id="card">

    <div class="flap"></div>

    <div class="seal" onclick="openCard()">FH</div>

    <div class="inner">
      <div>
        <h2>Fathima 💍 Habeeb</h2>
        <p>Are Getting Married ✨</p>
        <p><b>May 24, 2026</b></p>
        <p>Bangalore Palace 📍</p>
      </div>
    </div>

  </div>
</div>

<script>
function openCard(){
  document.getElementById("card").classList.add("open");
}
</script>

</body>
</html>
