<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A ❤️ B Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: black;
  color: white;
  overflow: hidden;
}

/* ================= DOOR INTRO ================= */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  z-index: 999;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(0,0,0,0.85);
  transition: transform 2s ease;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

.door-text {
  position: absolute;
  width: 100%;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  color: gold;
}

.door-text h1 {
  font-size: 3em;
}

/* ================= SECTIONS ================= */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

/* ================= HERO ================= */
#hero {
  background: url('images/home.jpg') center/cover no-repeat;
}

.overlay {
  background: rgba(0,0,0,0.6);
  padding: 20px;
  border-radius: 10px;
}

/* ================= GLOW ================= */
h1 {
  font-family: 'Playfair Display';
  color: gold;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px gold; }
  to { text-shadow: 0 0 30px gold; }
}

/* ================= PETALS ================= */
.petal {
  position: fixed;
  top: -50px;
  width: 20px;
  height: 20px;
  background: url('images/petal.png') no-repeat center/contain;
  pointer-events: none;
  z-index: 1000;
  animation: fall linear forwards;
}

@keyframes fall {
  0% {
    transform: translateY(-50px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) translateX(100px) rotate(360deg);
    opacity: 0.7;
  }
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
  <div class="door-text">
    <h1>A ❤️ B</h1>
    <p>Tap to Open</p>
  </div>
</div>

<!-- HERO -->
<section id="hero">
  <div class="overlay">
    <h1>A & B</h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE -->
<section style="background:#111;">
  <h1>Wedding</h1>
  <p>December 25, 2026</p>
  <a href="https://maps.google.com/?q=Bangalore+Palace" target="_blank" style="color:gold;">
    View Venue 📍
  </a>
</section>

<!-- COUNTDOWN -->
<section style="background:black;">
  <h1>Countdown</h1>
  <p id="timer"></p>
</section>

<script>
// DOOR OPEN
function openDoor() {
  let intro = document.getElementById("doorIntro");
  intro.classList.add("open");

  document.getElementById("music").play().catch(()=>{});

  setTimeout(() => {
    intro.style.display = "none";
  }, 2000);
}

// COUNTDOWN
const date = new Date("Dec 25, 2026").getTime();
setInterval(() => {
  let now = new Date().getTime();
  let gap = date - now;

  let d = Math.floor(gap / (1000*60*60*24));
  let h = Math.floor((gap / (1000*60*60)) % 24);
  let m = Math.floor((gap / (1000*60)) % 60);

  document.getElementById("timer").innerHTML =
    `<span style="font-size:2em;color:gold;">${d}</span> Days<br>${h}h ${m}m`;
}, 1000);

// PETALS
function createPetal() {
  let petal = document.createElement("div");
  petal.className = "petal";

  petal.style.left = Math.random() * 100 + "vw";
  petal.style.animationDuration = (5 + Math.random()*5) + "s";

  document.body.appendChild(petal);

  setTimeout(() => petal.remove(), 10000);
}

setInterval(createPetal, 300);
</script>

</body>
</html>
