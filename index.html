<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathu ❤️ Kettiyon Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fffaf5;
  color: #333;
  overflow: hidden;
  scroll-snap-type: y mandatory;
}

/* DOOR INTRO */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  z-index: 999;
  perspective: 1200px;
  transition: opacity 1s;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(5px);
  transition: transform 2s ease;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.1);
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

.door-text {
  position: absolute;
  width: 100%;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  color: #b8962e;
}

.door-text h1 {
  font-size: 3em;
}

/* SECTIONS */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  scroll-snap-align: start;
}

/* HERO */
#hero {
  background: url('images/home.jpg') center/cover no-repeat;
}

.overlay {
  background: rgba(255,255,255,0.7);
  padding: 25px;
  border-radius: 15px;
  backdrop-filter: blur(6px);
}

/* TEXT ANIMATION */
.fade {
  opacity: 0;
  transform: translateY(40px);
  transition: 1.2s ease;
}

.fade.show {
  opacity: 1;
  transform: translateY(0);
}

h1 {
  font-family: 'Playfair Display';
  color: #b8962e;
  opacity: 0;
  transform: translateY(20px);
  animation: textReveal 1.5s ease forwards;
}

@keyframes textReveal {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

p {
  color: #555;
}

/* PETALS */
.petal {
  position: fixed;
  top: -50px;
  background: url('images/petal.png') no-repeat center/contain;
  pointer-events: none;
  z-index: 1000;
  animation: fall linear forwards;
}

@keyframes fall {
  0% {
    transform: translateY(-50px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) translateX(120px) rotate(360deg);
    opacity: 0.7;
  }
}

/* LINKS */
a {
  color: #b8962e;
  text-decoration: none;
  border: 1px solid #b8962e;
  padding: 10px 20px;
  margin-top: 10px;
  border-radius: 20px;
}

/* MUSIC BUTTON */
button {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 2000;
  background: white;
  color: #b8962e;
  border: 1px solid #b8962e;
  padding: 10px;
  border-radius: 50%;
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button onclick="toggleMusic()">🔊</button>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
  <div class="door-text">
    <h1>
      Pathu <br> ❤️ <br> Kettiyon
    </h1>
    <p>Tap to Open</p>
  </div>
</div>

<!-- HERO -->
<section id="hero" class="fade">
  <div class="overlay">
    <h1>Pathu ❤️ Kettiyon</h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE -->
<section style="background:#fff;" class="fade">
  <h1>Wedding</h1>
  <p>May 26, 2026</p>
  <a href="https://maps.google.com/?q=Bangalore+Palace" target="_blank">
    View Venue 📍
  </a>
</section>

<!-- COUNTDOWN -->
<section style="background:#fffaf5;" class="fade">
  <h1>Countdown</h1>
  <p id="timer"></p>
</section>

<script>
// DOOR
function openDoor() {
  let intro = document.getElementById("doorIntro");
  intro.classList.add("open");

  document.getElementById("music").play().catch(()=>{});

  setTimeout(() => {
    intro.style.opacity = "0";
  }, 1500);

  setTimeout(() => {
    intro.style.display = "none";
    document.body.style.overflow = "auto";
  }, 2200);
}

// MUSIC TOGGLE
function toggleMusic(){
  let m = document.getElementById("music");
  m.muted = !m.muted;
}

// FADE ON SCROLL
const faders = document.querySelectorAll('.fade');

const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('show');
    }
  });
});

faders.forEach(el => observer.observe(el));

// COUNTDOWN WITH SECONDS
const date = new Date("May 26, 2026 00:00:00").getTime();

setInterval(() => {
  let now = new Date().getTime();
  let gap = date - now;

  if (gap <= 0) {
    document.getElementById("timer").innerHTML = "🎉 Wedding Day 🎉";
    return;
  }

  let d = Math.floor(gap / (1000*60*60*24));
  let h = Math.floor((gap / (1000*60*60)) % 24);
  let m = Math.floor((gap / (1000*60)) % 60);
  let s = Math.floor((gap / 1000) % 60);

  document.getElementById("timer").innerHTML =
    `<span style="font-size:2.5em;color:#b8962e;">${d}</span> Days<br>
     ${h}h : ${m}m : ${s}s`;
}, 1000);

// PETALS
function createPetal() {
  let petal = document.createElement("div");
  petal.className = "petal";

  petal.style.left = Math.random() * 100 + "vw";

  let size = 10 + Math.random()*20;
  petal.style.width = size + "px";
  petal.style.height = size + "px";

  petal.style.animationDuration = (5 + Math.random()*5) + "s";

  document.body.appendChild(petal);

  setTimeout(() => petal.remove(), 10000);
}

setInterval(createPetal, 300);
</script>

</body>
</html>
