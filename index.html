<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  background: #e8dcc7;
  font-family: serif;
}

/* FULL SCREEN */
.scene {
  width: 100vw;
  height: 100vh;
  position: relative;
  perspective: 1400px;
}

/* ENVELOPE IMAGE FULL SCREEN */
.card {
  width: 100%;
  height: 100%;

  background: url('https://raw.githubusercontent.com/nibumathewam-dot/wedding-invite/main/images/F_H.png') no-repeat center;
  background-size: contain; /* change to cover if needed */

  position: relative;
  transform-style: preserve-3d;
}

/* FLAP */
.flap {
  position: absolute;
  top: 0;
  width: 100%;
  height: 50%;

  background: inherit;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: top;

  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top;
  transition: transform 1s ease;
  z-index: 5;
}

/* SEAL BUTTON */
.seal {
  position: absolute;
  bottom: 25%;
  left: 50%;
  transform: translateX(-50%);

  width: 80px;
  height: 80px;
  border-radius: 50%;

  background: radial-gradient(circle, #d4af37, #b8962e);

  display: flex;
  justify-content: center;
  align-items: center;

  font-size: 22px;
  font-weight: bold;
  color: white;

  cursor: pointer;
  z-index: 6;
  box-shadow: 0 8px 25px rgba(0,0,0,0.4);
}

/* INNER CARD */
.inner {
  position: absolute;
  width: 80%;
  max-width: 400px;
  left: 50%;
  transform: translateX(-50%) rotateX(20deg);

  bottom: -60%;

  background: #fffaf5;
  border-radius: 15px;
  padding: 25px;
  text-align: center;

  box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  transition: all 1.2s ease;
}

/* TEXT */
.inner h2 {
  color: #b8962e;
  margin-bottom: 10px;
}

.inner p {
  color: #555;
}

/* OPEN ANIMATION */
.open .flap {
  transform: rotateX(180deg);
}

.open .inner {
  bottom: 15%;
  transform: translateX(-50%) rotateX(0deg);
}

.open .seal {
  opacity: 0;
  transform: translateX(-50%) scale(0.7);
}
</style>
</head>

<body>

<div class="scene">
  <div class="card" id="card">

    <!-- FLAP -->
    <div class="flap"></div>

    <!-- SEAL -->
    <div class="seal" onclick="openCard()">FH</div>

    <!-- INNER CARD -->
    <div class="inner">
      <h2>Fathima 💍 Habeeb</h2>
      <p>Are Getting Married ✨</p>
      <p><b>May 24, 2026</b></p>
      <p>Bangalore Palace 📍</p>
    </div>

  </div>
</div>

<script>
function openCard() {
  document.getElementById("card").classList.add("open");
}
</script>

</body>
</html>
