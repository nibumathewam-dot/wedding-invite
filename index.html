<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<style>
body{
  margin:0;
  height:100vh;
  background:#e8dcc7;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  font-family:serif;
}

/* SCENE */
.scene{
  width:100%;
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  perspective:1400px;
}

/* ENVELOPE */
.card{
  position:relative;
  width:min(95vw,420px);
  height:min(80vh,550px);
  background:url('https://raw.githubusercontent.com/nibumathewam-dot/wedding-invite/main/images/F_H.png') center/cover no-repeat;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 30px 70px rgba(0,0,0,0.35);
  transform-style:preserve-3d;
}

/* FLAP */
.flap{
  position:absolute;
  width:100%;
  height:50%;
  background:inherit;
  clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;
  transition:transform 1s ease;
  z-index:5;
}

/* SEAL */
.seal{
  position:absolute;
  bottom:30%;
  left:50%;
  transform:translateX(-50%);
  width:80px;
  height:80px;
  background:radial-gradient(circle,#d4af37,#b8962e);
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:22px;
  font-weight:bold;
  cursor:pointer;
  z-index:6;
}

/* INNER CARD (IMPORTANT FIX) */
.inner{
  position:absolute;
  width:85%;
  height:75%;
  left:7.5%;
  bottom:-70%; /* start INSIDE envelope */

  background:#fffaf5;
  border-radius:15px;
  padding:25px;
  text-align:center;

  display:flex;
  justify-content:center;
  align-items:center;

  box-shadow:0 20px 50px rgba(0,0,0,0.25);

  /* hidden inside */
  transform:rotateX(15deg);
  transition:all 1.3s ease;
  z-index:2;
}

/* TEXT */
.inner h2{
  color:#b8962e;
}

/* STEP 1: flap open */
.open .flap{
  transform:rotateX(180deg);
}

/* STEP 2: card slides out */
.open .inner{
  bottom:10%;                /* move upward */
  transform:rotateX(0deg) scale(1.05);
}

/* STEP 3: seal fade */
.open .seal{
  opacity:0;
  transform:translateX(-50%) scale(0.7);
}

</style>
</head>

<body>

<div class="scene">
  <div class="card" id="card">

    <div class="flap"></div>

    <div class="seal" onclick="openCard()">FH</div>

    <div class="inner">
      <div>
        <h2>Fathima 💍 Habeeb</h2>
        <p>Are Getting Married ✨</p>
        <p><b>May 24, 2026</b></p>
        <p>Bangalore Palace 📍</p>
      </div>
    </div>

  </div>
</div>

<script>
function openCard(){
  document.getElementById("card").classList.add("open");
}
</script>

</body>
</html>
