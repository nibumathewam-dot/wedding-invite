<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fffaf5;
  color: #333;
  overflow-x: hidden;
  overflow-y: hidden;
  scroll-snap-type: y mandatory;
}

/* ===================== */
/* INVITE INTRO */
/* ===================== */
#inviteIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 20000;
}

#inviteIntro::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(10px);
  background: rgba(0,0,0,0.4);
}

.inviteContent {
  position: relative;
  z-index: 2;
  text-align: center;
}

.inviteText {
  color: white;
  font-size: 2em;
  white-space: nowrap;
  overflow: hidden;
  border-right: 3px solid white;
  width: 0;
  margin: auto;
  animation: typing 3s steps(30, end) forwards, blink 0.7s infinite;
}

@keyframes typing {
  from { width: 0 }
  to { width: 100% }
}

@keyframes blink {
  50% { border-color: transparent }
}

/* ===================== */
/* DOOR */
/* ===================== */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  z-index: 999;
  perspective: 1200px;
  transition: opacity 1s;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(5px);
  transition: transform 2s ease;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

/* ===================== */
/* PETALS */
/* ===================== */
#petalContainer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  overflow: hidden;
  z-index: 5000;
}

.petal {
  position: absolute;
  background: url('images/petal.png') no-repeat center/contain;
  animation: fall linear forwards;
}

@keyframes fall {
  0% {
    transform: translateY(-10vh) translateX(0) rotate(0deg);
  }
  100% {
    transform: translateY(110vh) translateX(60px) rotate(360deg);
  }
}

/* ===================== */
/* SECTIONS */
/* ===================== */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  scroll-snap-align: start;
  text-align: center;
  padding: 20px;
}

#hero {
  background: url('images/home.jpg') center/cover no-repeat;
}

.overlay {
  background: rgba(255,255,255,0.7);
  padding: 25px;
  border-radius: 15px;
  backdrop-filter: blur(6px);
}

h1 {
  font-family: 'Playfair Display';
  color: #b8962e;
}

/* BUTTON */
button {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 2000;
  background: white;
  color: #b8962e;
  border: 1px solid #b8962e;
  padding: 10px;
  border-radius: 50%;
}

/* LINKS */
a {
  color: #b8962e;
  text-decoration: none;
  border: 1px solid #b8962e;
  padding: 10px 20px;
  margin-top: 10px;
  border-radius: 20px;
}
</style>
</head>

<body>

<!-- INVITE INTRO -->
<div id="inviteIntro">
  <div class="inviteContent">
    <h1 class="inviteText">You are exclusively invited 💍</h1>
    <p style="color:white;margin-top:15px;">Fathima 💍 Habeeb</p>
  </div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button onclick="toggleMusic()">🔊</button>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
</div>

<!-- PETALS -->
<div id="petalContainer"></div>

<!-- HERO -->
<section id="hero">
  <div class="overlay">
    <h1>Fathima 💍 Habeeb</h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE -->
<section style="background:#fff;">
  <h1>Wedding</h1>
  <p>May 26, 2026</p>

  <a href="https://maps.google.com/?q=Bangalore+Palace" target="_blank">
    View Venue 📍
  </a>
</section>

<!-- COUNTDOWN -->
<section style="background:#fffaf5;">
  <h1>Countdown</h1>
  <p id="timer"></p>
</section>

<script>

/* AUTO INTRO + MUSIC */
window.addEventListener("load", () => {
  const music = document.getElementById("music");

  music.play().catch(() => {
    document.body.addEventListener("click", () => {
      music.play();
    }, { once: true });
  });

  setTimeout(() => {
    const intro = document.getElementById("inviteIntro");
    intro.style.transition = "opacity 1s";
    intro.style.opacity = "0";

    setTimeout(() => {
      intro.style.display = "none";
      document.body.style.overflowY = "auto";
      openDoor();
    }, 1000);
  }, 4000);
});

/* DOOR */
function openDoor(){
  document.getElementById("doorIntro").classList.add("open");

  setTimeout(()=>{
    document.getElementById("doorIntro").style.opacity="0";
  },1500);

  setTimeout(()=>{
    document.getElementById("doorIntro").style.display="none";
    startPetals(); // 🌹 start petals
  },2200);
}

/* PETALS */
function createPetal() {
  const petal = document.createElement("div");
  petal.classList.add("petal");

  petal.style.left = Math.random() * 100 + "vw";
  let size = 15 + Math.random()*25;
  petal.style.width = size + "px";
  petal.style.height = size + "px";

  petal.style.animationDuration = (3 + Math.random()*3) + "s";

  document.getElementById("petalContainer").appendChild(petal);

  setTimeout(() => petal.remove(), 6000);
}

function startPetals() {
  setInterval(createPetal, 200);
}

/* MUSIC */
function toggleMusic(){
  let m=document.getElementById("music");
  m.muted = !m.muted;
}

/* COUNTDOWN */
const date = new Date("May 26, 2026 00:00:00").getTime();

setInterval(()=>{
  let now=new Date().getTime();
  let gap=date-now;

  let d=Math.max(0, Math.floor(gap/(1000*60*60*24)));

  document.getElementById("timer").innerHTML =
    `<span style="font-size:2.5em;color:#b8962e;">${d}</span> Days Left`;
},1000);

</script>

</body>
</html>
