<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ✅ BASE */
body{
  margin:0;
  font-family:sans-serif;
  overflow:hidden;
  background:black;
  scroll-behavior:smooth;
}
body.scroll{ overflow-y:auto; }

/* ✅ IMAGE */
#imageContainer{
  position:fixed;
  width:100%;
  height:100vh;
  overflow:hidden;
  z-index:1;
}

#bgImg{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:blur(15px);
  transform:scale(1.05);
  transition:2s ease;
}
.clear{
  filter:blur(0)!important;
  transform:scale(1)!important;
}

/* ✅ TEXT */
#text{
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  color:white;
  z-index:2000;
}

.typing{
  display:inline-block;
  font-size:28px;
  white-space:nowrap;
  overflow:hidden;
  border-right:3px solid white;
  max-width:0;

  animation:
    typing 5s steps(30,end) forwards,
    blink 0.7s step-end 6,
    hideCursor 0.1s forwards 5s;
}

@keyframes typing{
  from{max-width:0}
  to{max-width:100%}
}
@keyframes blink{
  50%{border-color:transparent}
}
@keyframes hideCursor{
  to{border-right:none}
}

/* ✅ COUPLE BOX */
#coupleName{
  position:absolute;
  top:30%;
  left:50%;
  transform:translate(-50%,20px);
  text-align:center;

  font-size:32px;
  color:#ffd700;

  padding:22px 35px;
  border-radius:22px;

  background:rgba(255,255,255,0.10);
  backdrop-filter:blur(12px);

  z-index:2000;
  opacity:0;
}

/* ✅ FORCE 2 LINES */
.tagline{
  line-height:1.4;
}

/* ✅ NAMES */
.names{
  font-size:40px;
  color:white;
  margin-top:8px;
}

/* ✅ ANIMATION */
.showNames{
  animation:fadeIn 2s forwards;
}

@keyframes fadeIn{
  to{opacity:1; transform:translate(-50%,0);}
}

/* ✅ BUTTON */
#btn{
  position:absolute;
  top:62%;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:130px;
  border-radius:50%;
  border:none;
  background:radial-gradient(circle,#ffd700,#b8962e);
  color:white;

  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;

  cursor:pointer;
  z-index:2000;
  opacity:0;
}

.showBtn{
  animation:fadeBtn 1s forwards,pulse 1.6s infinite;
}

@keyframes fadeBtn{to{opacity:1}}
@keyframes pulse{
  50%{transform:translateX(-50%) scale(1.1)}
}

/* ✅ DOOR */
#door{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  z-index:1000;
  perspective:1400px;
}

.side{
  width:50%;
  height:100vh;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(8px);
  transition:1.8s;
}

.left{transform-origin:left;}
.right{transform-origin:right;}

.open .left{transform:rotateY(-110deg);}
.open .right{transform:rotateY(110deg);}

/* ✅ PETALS */
#petalContainer{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:9999;
}

.petal{
  position:absolute;
  width:25px;
  height:25px;

  background-image:url('images/petal.png'); /* use transparent png */
  background-size:contain;
  background-repeat:no-repeat;

  animation:fall linear forwards;
}

@keyframes fall{
  from{transform:translateY(-10vh) rotate(0deg);}
  to{transform:translateY(110vh) rotate(360deg);}
}

/* ✅ STORY */
#story{
  height:100vh;
  background:#111;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.storyBox{
  max-width:600px;
  line-height:1.7;
}

/* ✅ MOBILE FIX */
@media(max-width:768px){
  #coupleName{ font-size:26px; }
  .names{ font-size:32px; }
}

</style>
</head>

<body>

<!-- ✅ IMAGE -->
<div id="imageContainer">
  <img id="bgImg" src="images/FandH.jpg">
</div>

<!-- ✅ TEXT -->
<div id="text">
  <span class="typing">You are exclusively invited 💍</span>
</div>

<!-- ✅ COUPLE TEXT (FORCED 2 LINES) -->
<div id="coupleName">
  <div class="tagline">
    We are getting<br>married 💍
  </div>
  <div class="names">Fathima ❤️ Habeeb</div>
</div>

<!-- ✅ BUTTON -->
<button id="btn" onclick="openDoor()">Tap<br>to Open 💍</button>

<!-- ✅ DOOR -->
<div id="door">
  <div class="side left"></div>
  <div class="side right"></div>
</div>

<!-- ✅ STORY -->
<div id="story">
  <div class="storyBox">
    <h2>Our Story 💫</h2>
    <p>It started with a smile…</p>
    <p>Now it’s forever 💍</p>
  </div>
</div>

<!-- ✅ PETALS -->
<div id="petalContainer"></div>

<script>

const btn=document.getElementById("btn");
const img=document.getElementById("bgImg");
const petals=document.getElementById("petalContainer");

/* ✅ SHOW BUTTON AFTER TYPING */
document.querySelector(".typing").addEventListener("animationend",(e)=>{
  if(e.animationName==="typing"){
    btn.classList.add("showBtn");
  }
});

/* ✅ OPEN */
function openDoor(){

  document.getElementById("door").classList.add("open");
  img.classList.add("clear");

  document.body.classList.add("scroll");

  document.getElementById("text").style.display="none";
  btn.style.display="none";

  document.getElementById("coupleName").classList.add("showNames");

  startPetals();

  setTimeout(()=>{
    document.getElementById("door").style.display="none";
  },1800);
}

/* ✅ PETALS */
let interval;

function createPetal(){
  let p=document.createElement("div");
  p.className="petal";

  p.style.left=Math.random()*100+"vw";

  let size=15+Math.random()*20;
  p.style.width=size+"px";
  p.style.height=size+"px";

  let duration=4+Math.random()*3;
  p.style.animationDuration=duration+"s";

  petals.appendChild(p);
  setTimeout(()=>p.remove(),duration*1000);
}

function startPetals(){
  if(interval) return;
  interval=setInterval(()=>{
    if(petals.children.length<25){
      createPetal();
    }
  },200);
}

</script>

</body>
</html>
