<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Invite</title>

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
  background:black;
}

/* ✅ BACKGROUND */
#mainBg{
  position:fixed;
  width:100%;
  height:100vh;
  background:url('images/FandH.jpg') center/cover no-repeat;
  filter:blur(20px);
  transform:scale(1.1);
  transition:1.5s ease;
  z-index:1;
}

/* ✅ CLEAR IMAGE */
.clearView #mainBg{
  filter:blur(0);
  transform:scale(1);
}

/* ✅ TEXT */
.inviteContent{
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  z-index:10;
  color:white;
}

.inviteText{
  font-size:clamp(22px,6vw,36px);
}

/* ✅ BUTTON */
#tapBtn{
  position:absolute;
  top:60%;
  left:50%;
  transform:translateX(-50%);
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:#b8962e;
  color:white;
  font-size:16px;
  cursor:pointer;
  z-index:10;
  display:none;
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.1);}
  100%{transform:translateX(-50%) scale(1);}
}

/* ✅ DOOR */
#doorIntro{
  position:fixed;
  width:100%;
  height:100%;
  z-index:20;
  perspective:1500px;
}

.door{
  position:absolute;
  width:50%;
  height:100%;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(8px);
  transition:2s ease;
}

.left{ left:0; transform-origin:left;}
.right{ right:0; transform-origin:right;}

.open .left{ transform:rotateY(-110deg);}
.open .right{ transform:rotateY(110deg);}

/* ✅ PETALS */
#petalContainer{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:50;
}

.petal{
  position:absolute;
  width:20px;
  height:20px;
  background:url('images/petal.png') center/contain no-repeat;
  animation:fall linear forwards;
}

@keyframes fall{
  from{transform:translateY(-10vh);}
  to{transform:translateY(110vh);}
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div id="mainBg"></div>

<!-- TEXT -->
<div class="inviteContent">
  <h1 class="inviteText">You are exclusively invited 💍</h1>
</div>

<!-- BUTTON -->
<button id="tapBtn" onclick="openDoor()">Tap to Open 💍</button>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left"></div>
  <div class="door right"></div>
</div>

<!-- PETALS -->
<div id="petalContainer"></div>

<!-- MUSIC -->
<audio id="music" loop>
  music.mp3
</audio>

<script>
const btn = document.getElementById("tapBtn");
const door = document.getElementById("doorIntro");
const petals = document.getElementById("petalContainer");
const music = document.getElementById("music");

/* ✅ SHOW BUTTON AFTER 2s */
setTimeout(()=>{
  btn.style.display = "block";
},2000);

/* ✅ OPEN DOOR */
function openDoor(){
  btn.style.display="none";

  door.classList.add("open");

  document.body.classList.add("clearView");

  music.play().catch(()=>{});

  startPetals();

  setTimeout(()=>{
    door.style.display="none";
    document.body.style.overflow="auto";
  },2000);
}

/* ✅ PETALS */
function createPetal(){
  const p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";

  let size=15+Math.random()*15;
  p.style.width=size+"px";
  p.style.height=size+"px";
  p.style.animationDuration=(3+Math.random()*3)+"s";

  petals.appendChild(p);
  setTimeout(()=>p.remove(),5000);
}

function startPetals(){
  let i=setInterval(createPetal,150);
  setTimeout(()=>clearInterval(i),15000);
}
</script>

</body>
</html>
