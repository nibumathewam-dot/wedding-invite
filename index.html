<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fffaf5;
  color: #333;
  overflow: hidden;
}

/* ================= DOOR ================= */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  z-index: 9999;
  perspective: 1200px;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(5px);
  transition: transform 2s ease;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

.door-text {
  position: absolute;
  width: 100%;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  color: #b8962e;
}

.door-text h1 {
  font-size: 3em;
  font-family: 'Playfair Display';
}

/* ================= SECTIONS ================= */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

#hero {
  background: url('images/home.jpg') center/cover no-repeat;
}

.overlay {
  background: rgba(255,255,255,0.7);
  padding: 25px;
  border-radius: 15px;
  backdrop-filter: blur(6px);
}

/* TEXT */
h1 {
  font-family: 'Playfair Display';
  color: #b8962e;
}

p { color: #555; }

/* MUSIC */
button.music {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 2000;
  background: white;
  color: #b8962e;
  border: 1px solid #b8962e;
  padding: 10px;
  border-radius: 50%;
}

/* RSVP */
.rsvpBtn {
  padding: 12px 20px;
  border: 1px solid #b8962e;
  background: white;
  color: #b8962e;
  border-radius: 25px;
  cursor: pointer;
  font-size: 16px;
}

/* COUNTDOWN BIG */
#timer {
  font-size: 2.8em;
  color: #b8962e;
  font-weight: bold;
}

/* PETALS */
.petal {
  position: fixed;
  top: -50px;
  width: 18px;
  height: 18px;
  background: url('images/petal.png') no-repeat center/contain;
  pointer-events: none;
  z-index: 1000;
  animation: fall linear forwards;
}

@keyframes fall {
  0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) translateX(120px) rotate(360deg); opacity: 0.7; }
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="music" onclick="toggleMusic()">🔊</button>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>

  <div class="door-text">
    <h1>Fathima 💍 Habeeb</h1>
    <p>Tap to Open</p>
  </div>
</div>

<!-- HERO -->
<section id="hero">
  <div class="overlay">
    <h1>Fathima 💍 Habeeb</h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE -->
<section>
  <h1>Wedding</h1>
  <p>May 24, 2026</p>

  <a href="https://maps.google.com/?q=Bangalore+Palace" target="_blank">
    View Venue 📍
  </a>
</section>

<!-- COUNTDOWN -->
<section>
  <h1>Countdown</h1>
  <div id="timer"></div>

  <br>
  <button class="rsvpBtn" onclick="openRSVP()">RSVP 💌</button>
</section>

<script>

/* DOOR */
function openDoor(){
  document.getElementById("doorIntro").classList.add("open");

  document.getElementById("music").play().catch(()=>{});

  setTimeout(()=>{
    document.getElementById("doorIntro").style.display="none";
    document.body.style.overflow="auto";
  },2000);
}

/* MUSIC */
function toggleMusic(){
  let m=document.getElementById("music");
  m.paused ? m.play() : m.pause();
}

/* COUNTDOWN */
const date = new Date("May 24, 2026 00:00:00").getTime();

setInterval(()=>{
  let now=new Date().getTime();
  let gap=date-now;

  if(gap<=0){
    document.getElementById("timer").innerHTML="🎉 Wedding Day 🎉";
    return;
  }

  let d=Math.floor(gap/(1000*60*60*24));
  let h=Math.floor((gap/(1000*60*60))%24);
  let m=Math.floor((gap/(1000*60))%60);
  let s=Math.floor((gap/1000)%60);

  document.getElementById("timer").innerHTML =
  `
  <div>${d} Days</div>
  <div>${h}h : ${m}m : ${s}s</div>
  `;
},1000);

/* PETALS */
function createPetal(){
  let p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(4+Math.random()*4)+"s";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),9000);
}
setInterval(createPetal,300);

/* RSVP WINDOW */
function openRSVP(){
  let w = window.open("", "_blank", "width=420,height=520");

  w.document.write(`
    <title>RSVP - Fathima & Habeeb</title>
    <style>
      body{font-family:Poppins;text-align:center;padding:20px;background:#fffaf5;}
      input,textarea{width:90%;padding:10px;margin:8px;border-radius:8px;border:1px solid #ccc;}
      button{padding:10px 20px;background:#b8962e;color:white;border:none;border-radius:20px;}
      h2{color:#b8962e;}
    </style>

    <h2>💍 RSVP</h2>
    <p>Fathima & Habeeb Wedding</p>

    <input placeholder="Your Name">
    <input placeholder="Guests" type="number">
    <textarea placeholder="Message"></textarea>

    <button onclick="alert('RSVP Saved ❤️')">Submit</button>
  `);
}

</script>

</body>
</html>
