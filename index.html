<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathu 💍 Kettiyon Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fffaf5;
  color: #333;
  overflow: hidden;
  scroll-snap-type: y mandatory;
}

/* ===================== */
/* SWIPE INTRO (INSTAGRAM STYLE) */
/* ===================== */
#introSwipe {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  background: black;
  z-index: 10000;
}

.swipeContainer {
  display: flex;
  width: 500%;
  height: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
}

.card {
  flex: 0 0 100%;
  height: 100vh;
  scroll-snap-align: start;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: white;
}

.overlayCard {
  background: rgba(0,0,0,0.4);
  padding: 20px;
  border-radius: 15px;
}

/* ===================== */
/* DOOR */
/* ===================== */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  z-index: 999;
  perspective: 1200px;
  transition: opacity 1s;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(5px);
  transition: transform 2s ease;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

/* ===================== */
/* SECTIONS */
/* ===================== */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  scroll-snap-align: start;
  text-align: center;
  padding: 20px;
}

#hero {
  background: url('images/home.jpg') center/cover no-repeat;
}

.overlay {
  background: rgba(255,255,255,0.8);
  padding: 25px;
  border-radius: 15px;
}

/* TEXT */
h1 {
  font-family: 'Playfair Display';
  color: #b8962e;
}

/* MUSIC */
.musicBtn {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 2000;
  border-radius: 50%;
  padding: 10px;
  border: 1px solid #b8962e;
  background: white;
  color: #b8962e;
}

/* RSVP */
.rsvpBtn {
  padding: 12px 20px;
  border: 1px solid #b8962e;
  background: white;
  color: #b8962e;
  border-radius: 25px;
  font-size: 16px;
  cursor: pointer;
}

/* PETALS */
.petal {
  position: fixed;
  top: -50px;
  background: url('images/petal.png') no-repeat center/contain;
  pointer-events: none;
  animation: fall linear forwards;
  z-index: 1000;
}

@keyframes fall {
  0% { transform: translateY(-50px); opacity: 1; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0.6; }
}

/* RSVP MODAL */
#rsvpModal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 9999;
  justify-content: center;
  align-items: center;
}

.modalBox {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 90%;
  max-width: 400px;
  text-align: center;
}

input, textarea {
  width: 90%;
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
}
</style>
</head>

<body>

<!-- ===================== -->
<!-- SWIPE INTRO (RING VERSION) -->
<!-- ===================== -->
<div id="introSwipe">
  <div class="swipeContainer">

    <div class="card" style="background:url('images/home.jpg') center/cover;">
      <div class="overlayCard">
        <h1>Welcome 💍</h1>
        <p>Swipe to continue</p>
      </div>
    </div>

    <div class="card" style="background:#b8962e;">
      <div class="overlayCard">
        <h1>Pathu 💍 Kettiyon</h1>
        <p>Two souls, one journey</p>
      </div>
    </div>

    <div class="card" style="background:#fffaf5;color:black;">
      <div class="overlayCard">
        <h1>Save The Date 💍</h1>
        <p>May 26, 2026</p>
      </div>
    </div>

    <div class="card" style="background:#333;">
      <div class="overlayCard">
        <h1>Venue 📍</h1>
        <p>Bangalore Palace</p>
      </div>
    </div>

    <div class="card" style="background:#b8962e;">
      <div class="overlayCard">
        <h1>You’re Invited 💍</h1>
        <button class="rsvpBtn" onclick="enterWedding()">Enter Wedding 💍</button>
      </div>
    </div>

  </div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="musicBtn" onclick="toggleMusic()">🔊</button>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
</div>

<!-- HERO -->
<section id="hero">
  <div class="overlay">
    <h1>Pathu 💍 Kettiyon</h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE -->
<section>
  <h1>Wedding Date</h1>
  <p>May 26, 2026</p>
</section>

<!-- COUNTDOWN -->
<section>
  <h1>Countdown</h1>
  <p id="timer"></p>
  <button class="rsvpBtn" onclick="openRSVP()">RSVP 💌</button>
</section>

<!-- RSVP -->
<div id="rsvpModal">
  <div class="modalBox">
    <h2 style="color:#b8962e;">RSVP</h2>

    <input id="name" placeholder="Name">
    <input id="guests" type="number" placeholder="Guests">
    <textarea id="msg" placeholder="Message"></textarea>

    <button class="rsvpBtn" onclick="submitRSVP()">Submit</button>
    <p id="status"></p>

    <button onclick="closeRSVP()" style="border:none;background:none;color:red;">
      Close ✖
    </button>
  </div>
</div>

<script>

/* SWIPE EXIT */
function enterWedding(){
  document.getElementById("introSwipe").style.display = "none";
  document.body.style.overflow = "auto";
}

/* DOOR */
function openDoor(){
  document.getElementById("doorIntro").classList.add("open");
  document.getElementById("music").play().catch(()=>{});

  setTimeout(()=>{
    document.getElementById("doorIntro").style.opacity="0";
  },1500);

  setTimeout(()=>{
    document.getElementById("doorIntro").style.display="none";
    document.body.style.overflow="auto";
  },2200);
}

/* MUSIC */
function toggleMusic(){
  let m=document.getElementById("music");
  m.paused ? m.play() : m.pause();
}

/* COUNTDOWN */
const date=new Date("May 26, 2026").getTime();
setInterval(()=>{
  let now=new Date().getTime();
  let gap=date-now;
  let d=Math.floor(gap/(1000*60*60*24));
  document.getElementById("timer").innerHTML =
  `<span style="color:#b8962e;font-size:2em">${d}</span> Days Left`;
},1000);

/* RSVP */
function openRSVP(){document.getElementById("rsvpModal").style.display="flex";}
function closeRSVP(){document.getElementById("rsvpModal").style.display="none";}

function submitRSVP(){
  let name=document.getElementById("name").value;
  let guests=document.getElementById("guests").value;

  if(!name||!guests){alert("Fill details");return;}

  let data=JSON.parse(localStorage.getItem("rsvps")||"[]");
  data.push({name,guests,time:new Date().toLocaleString()});
  localStorage.setItem("rsvps",JSON.stringify(data));

  document.getElementById("status").innerText="Saved ❤️";
  setTimeout(closeRSVP,1000);
}

/* PETALS */
function createPetal(){
  let p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";
  p.style.width="15px";
  p.style.height="15px";
  p.style.animationDuration=(4+Math.random()*4)+"s";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),9000);
}
setInterval(createPetal,400);

</script>

</body>
</html>
