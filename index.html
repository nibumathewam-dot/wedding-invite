<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fathima 💍 Habeeb Wedding</title>

<style>
body{
  margin:0;
  font-family:Poppins, sans-serif;
  background:black;
  overflow:hidden;
}

/* BACKGROUND */
.bg{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

.bg-blur, .bg-clear{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  background:url('images/FandH.jpg') center/cover no-repeat;
}

.bg-blur{
  filter:blur(20px);
  transform:scale(1.15);
  transition:2s ease;
}

.bg-clear{
  opacity:0;
  transition:2s ease;
}

.clearView .bg-blur{
  filter:blur(0);
  transform:scale(1);
}

.clearView .bg-clear{
  opacity:1;
}

/* TEXT */
.inviteContent{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:100%;
  text-align:center;
  z-index:2;
}

.inviteText{
  color:white;
  font-size:clamp(1.3rem,6vw,2.5rem);
  border-right:3px solid white;
  white-space:nowrap;
  overflow:hidden;
  width:0;
  margin:auto;
  animation:typing 3s steps(30,end) forwards, blink .6s infinite;
}

@keyframes typing{
  from{width:0}
  to{width:90%}
}
@keyframes blink{
  50%{border-color:transparent}
}

/* 🚪 BEAST DOOR */
#doorIntro{
  position:fixed;
  width:100%;
  height:100vh;
  z-index:999;
  perspective:1600px;
}

.door{
  position:absolute;
  width:50%;
  height:100%;
  top:0;

  background:linear-gradient(
    rgba(255,255,255,0.35),
    rgba(255,255,255,0.1)
  );

  backdrop-filter:blur(10px);
  box-shadow:inset -5px 0 25px rgba(0,0,0,0.5);

  transition:transform 2.2s cubic-bezier(0.7,0,0.3,1);
}

.left{
  left:0;
  transform-origin:left;
}

.right{
  right:0;
  transform-origin:right;
}

/* GOLD CENTER LINE */
.left::after, .right::after{
  content:"";
  position:absolute;
  width:2px;
  height:100%;
  top:0;
  background:linear-gradient(#f7d774,#b8962e);
}

.left::after{ right:0; }
.right::after{ left:0; }

/* OPEN */
.open .left{
  transform:rotateY(-110deg) translateZ(30px);
}
.open .right{
  transform:rotateY(110deg) translateZ(30px);
}

/* PETALS */
#petalContainer{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:1000;
}

.petal{
  position:absolute;
  background:url('images/petal.png') center/contain no-repeat;
  animation:fall linear forwards;
}

@keyframes fall{
  0%{transform:translateY(-10vh) rotate(0);}
  100%{transform:translateY(110vh) rotate(360deg);}
}

/* HERO */
section{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.overlay{
  background:rgba(255,255,255,0.85);
  padding:20px;
  border-radius:15px;
  text-align:center;
}

.rsvp-btn{
  margin-top:15px;
  padding:10px 20px;
  background:#b8962e;
  color:white;
  border:none;
  border-radius:20px;
}
</style>
</head>

<body>

<!-- AUDIO -->
<audio id="music" loop>
  music.mp3
</audio>

<audio id="typingSound">
  typing.mp3
</audio>

<!-- INTRO -->
<div id="inviteIntro" class="bg">
  <div class="bg-blur"></div>
  <div class="bg-clear"></div>

  <div class="inviteContent">
    <h1 class="inviteText">You are exclusively invited 💍</h1>
  </div>
</div>

<!-- DOOR -->
<div id="doorIntro" class="bg">
  <div class="bg-blur"></div>
  <div class="bg-clear"></div>

  <div class="door left"></div>
  <div class="door right"></div>
</div>

<!-- PETALS -->
<div id="petalContainer"></div>

<!-- HERO -->
<section class="bg">
  <div class="bg-blur"></div>
  <div class="bg-clear"></div>

  <div class="overlay">
    <h1>Fathima 💍 Habeeb</h1>
    <p>Are Getting Married ✨</p>
    <button onclick="openRSVP()" class="rsvp-btn">RSVP 💌</button>
  </div>
</section>

<script>
const inviteIntro=document.getElementById("inviteIntro");
const doorIntro=document.getElementById("doorIntro");
const music=document.getElementById("music");
const typingSound=document.getElementById("typingSound");
const petalContainer=document.getElementById("petalContainer");

/* TRY AUTO */
typingSound.play().catch(()=>{});

/* UNLOCK ON CLICK */
document.body.addEventListener("click",()=>{
  typingSound.play();
  music.play();
},{once:true});

/* FLOW */
window.onload=()=>{
  setTimeout(()=>{
    typingSound.pause();
  },3000);

  setTimeout(()=>{
    inviteIntro.style.opacity="0";

    setTimeout(()=>{
      inviteIntro.style.display="none";
      openDoor();
    },400);

  },3000);
};

/* DOOR */
function openDoor(){
  doorIntro.classList.add("open");

  /* LIGHT FLASH */
  document.body.style.background="white";
  setTimeout(()=>{
    document.body.style.background="black";
  },150);

  document.querySelectorAll(".bg").forEach(el=>{
    el.classList.add("clearView");
  });

  startPetals();

  setTimeout(()=>{
    doorIntro.style.display="none";
    document.body.style.overflow="auto";
  },2000);
}

/* PETALS */
function createPetal(){
  const p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";

  let s=15+Math.random()*20;
  p.style.width=s+"px";
  p.style.height=s+"px";
  p.style.animationDuration=(3+Math.random()*3)+"s";

  petalContainer.appendChild(p);
  setTimeout(()=>p.remove(),6000);
}

function startPetals(){
  let i=setInterval(createPetal,150);
  setTimeout(()=>clearInterval(i),15000);
}

/* RSVP */
function openRSVP(){
  window.open("rsvp.html","RSVP","width=420,height=650");
}
</script>

</body>
</html>
