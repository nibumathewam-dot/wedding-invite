<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

/* ✅ BASE */
body{
  margin:0;
  font-family:sans-serif;
  overflow:hidden;
  background:black;
}
body.scroll{ overflow-y:auto; }

/* ✅ IMAGE */
#imageContainer{
  position:fixed;
  width:100%;
  height:100vh;
  overflow:hidden;
  z-index:1;
}

#bgImg{
  width:100%;
  height:100%;
  object-fit:cover;
  filter:blur(15px);
  transform:scale(1.05);
  transition:2s ease;
}

.clear{
  filter:blur(0)!important;
  transform:scale(1)!important;
}

/* ✅ TEXT */
#text{
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  color:white;
  z-index:2000;
}

.typing{
  display:inline-block;
  font-size:28px;
  white-space:nowrap;
  overflow:hidden;
  border-right:3px solid white;
  max-width:0;

  animation:
    typing 5s steps(30,end) forwards,
    blink 0.7s step-end 5,
    hideCursor 0.1s forwards 5s;
}

@keyframes typing{
  from{max-width:0}
  to{max-width:100%}
}
@keyframes blink{50%{border-color:transparent}}
@keyframes hideCursor{to{border-right:none}}

/* ✅ PREMIUM BOX */
#coupleName{
  position:absolute;
  top:30%;
  left:50%;
  transform:translate(-50%,20px);
  text-align:center;

  font-size:32px;
  font-family:Georgia, serif;
  letter-spacing:2px;
  color:#ffd700;

  padding:22px 35px;
  border-radius:22px;

  background:rgba(255,255,255,0.10);
  backdrop-filter:blur(12px);

  border:1px solid rgba(255,255,255,0.35);

  text-shadow:
    0 0 10px rgba(255,215,0,0.8),
    0 0 30px rgba(255,215,0,0.6);

  box-shadow:
    0 0 25px rgba(0,0,0,0.6),
    inset 0 0 15px rgba(255,255,255,0.15);

  z-index:2000;
  opacity:0;
}

.names{
  font-size:40px;
  color:white;
  margin-top:8px;

  text-shadow:
    0 0 20px #ffd700,
    0 0 40px #ffd700;
}

.showNames{
  animation:
    fadeIn 2s forwards,
    float 4s infinite,
    glow 2.5s infinite;
}

@keyframes fadeIn{
  to{opacity:1; transform:translate(-50%,0);}
}

@keyframes float{
  0%,100%{transform:translate(-50%,0)}
  50%{transform:translate(-50%,-10px)}
}

@keyframes glow{
  0%{box-shadow:0 0 15px #ffd700;}
  50%{box-shadow:0 0 60px #ffd700;}
  100%{box-shadow:0 0 15px #ffd700;}
}

/* ✅ BUTTON */
#btn{
  position:absolute;
  top:62%;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:130px;
  border-radius:50%;
  border:none;
  background:radial-gradient(circle,#ffd700,#b8962e);
  color:white;

  display:flex;
  justify-content:center;
  align-items:center;

  cursor:pointer;
  z-index:2000;
  opacity:0;
}

.showBtn{
  animation:fadeBtn 1s forwards,pulse 1.6s infinite;
}

@keyframes fadeBtn{to{opacity:1}}
@keyframes pulse{
  0%{transform:translateX(-50%) scale(1)}
  50%{transform:translateX(-50%) scale(1.1)}
  100%{transform:translateX(-50%) scale(1)}
}

/* ✅ DOOR */
#door{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  z-index:1000;
  perspective:1400px;
}

.side{
  width:50%;
  height:100vh;
  background:rgba(255,255,255,0.2);
  backdrop-filter:blur(8px);
  transition:1.8s;
}

.left{transform-origin:left;}
.right{transform-origin:right;}

.open .left{transform:rotateY(-110deg);}
.open .right{transform:rotateY(110deg);}

</style>
</head>

<body>

<!-- ✅ IMAGE -->
<div id="imageContainer">
  <img id="bgImg" src="images/FandH.jpg">
</div>

<!-- ✅ TEXT -->
<div id="text">
  <span class="typing">You are exclusively invited 💍</span>
</div>

<!-- ✅ COUPLE BOX -->
<div id="coupleName">
  <div>We are getting married</div>
  <div class="names">Fathima ❤️ Habeeb</div>
</div>

<!-- ✅ BUTTON -->
<button id="btn" onclick="openDoor()">Tap<br>to Open 💍</button>

<!-- ✅ DOOR -->
<div id="door">
  <div class="side left"></div>
  <div class="side right"></div>
</div>

<!-- ✅ MUSIC -->
<audio id="music" src="music.mp3"></audio>

<script>

const btn=document.getElementById("btn");
const img=document.getElementById("bgImg");
const music=document.getElementById("music");

/* ✅ SHOW BUTTON */
document.querySelector(".typing").addEventListener("animationend",()=>{
  btn.classList.add("showBtn");
});

/* ✅ OPEN DOOR */
function openDoor(){

  music.play().catch(()=>{});

  document.getElementById("door").classList.add("open");

  img.classList.add("clear");

  document.getElementById("text").style.display="none";
  btn.style.display="none";

  document.getElementById("coupleName").classList.add("showNames");

  setTimeout(()=>{
    document.getElementById("door").style.display="none";
  },1800);
}

</script>

</body>
</html>
