<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathu ❤️ Kettiyon Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fffaf5;
  color: #333;
  overflow: hidden;
  scroll-snap-type: y mandatory;
}

/* DOOR */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  z-index: 999;
  perspective: 1200px;
  transition: opacity 1s;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(5px);
  transition: transform 2s ease;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

.door-text {
  position: absolute;
  width: 100%;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  color: #b8962e;
}

.door-text h1 {
  font-family: 'Playfair Display';
  font-size: 2.5em;
}

/* SECTIONS */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  scroll-snap-align: start;
  text-align: center;
  padding: 20px;
}

/* HERO */
#hero {
  background: url('images/home.jpg') center/cover no-repeat;
}

.overlay {
  background: rgba(255,255,255,0.8);
  padding: 25px;
  border-radius: 15px;
}

/* TEXT */
h1 {
  font-family: 'Playfair Display';
  color: #b8962e;
}

/* MUSIC BUTTON */
.musicBtn {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 2000;
  border-radius: 50%;
  padding: 10px;
  border: 1px solid #b8962e;
  background: white;
  color: #b8962e;
}

/* RSVP BUTTON */
.rsvpBtn {
  padding: 12px 20px;
  border: 1px solid #b8962e;
  background: white;
  color: #b8962e;
  border-radius: 25px;
  font-size: 16px;
  cursor: pointer;
}

/* PETALS */
.petal {
  position: fixed;
  top: -50px;
  background: url('images/petal.png') no-repeat center/contain;
  pointer-events: none;
  animation: fall linear forwards;
  z-index: 1000;
}

@keyframes fall {
  0% { transform: translateY(-50px); opacity: 1; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0.6; }
}

/* RSVP MODAL */
#rsvpModal {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 9999;
  justify-content: center;
  align-items: center;
}

.modalBox {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 90%;
  max-width: 400px;
  text-align: center;
}

input, textarea {
  width: 90%;
  padding: 10px;
  margin: 5px;
  border: 1px solid #ccc;
  border-radius: 8px;
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="musicBtn" onclick="toggleMusic()">🔊</button>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
  <div class="door-text">
    <h1>Pathu ❤️ Kettiyon</h1>
    <p>Tap to Open</p>
  </div>
</div>

<!-- HERO -->
<section id="hero">
  <div class="overlay">
    <h1>Pathu ❤️ Kettiyon</h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE -->
<section>
  <h1>Wedding Date</h1>
  <p>May 26, 2026</p>

  <a href="https://maps.google.com/?q=Bangalore+Palace" target="_blank">
    View Venue 📍
  </a>
</section>

<!-- COUNTDOWN -->
<section>
  <h1>Countdown</h1>
  <p id="timer"></p>

  <br>

  <!-- RSVP BUTTON -->
  <button class="rsvpBtn" onclick="openRSVP()">RSVP Now 💌</button>
</section>

<!-- RSVP MODAL -->
<div id="rsvpModal">
  <div class="modalBox">
    <h2 style="color:#b8962e;">RSVP</h2>

    <input id="name" placeholder="Your Name">
    <input id="guests" type="number" placeholder="Guests">
    <textarea id="msg" placeholder="Message (optional)"></textarea>

    <button onclick="submitRSVP()" class="rsvpBtn">Submit</button>

    <p id="status"></p>

    <br>
    <button onclick="closeRSVP()" style="border:none;background:none;color:red;">
      Close ✖
    </button>
  </div>
</div>

<script>

// DOOR
function openDoor() {
  document.getElementById("doorIntro").classList.add("open");

  document.getElementById("music").play().catch(()=>{});

  setTimeout(() => {
    document.getElementById("doorIntro").style.opacity = "0";
  }, 1500);

  setTimeout(() => {
    document.getElementById("doorIntro").style.display = "none";
    document.body.style.overflow = "auto";
  }, 2200);
}

// MUSIC
function toggleMusic(){
  let m = document.getElementById("music");
  if(m.paused) m.play();
  else m.pause();
}

// COUNTDOWN
const date = new Date("May 26, 2026 00:00:00").getTime();

setInterval(() => {
  let now = new Date().getTime();
  let gap = date - now;

  if (gap <= 0) {
    document.getElementById("timer").innerHTML = "🎉 Wedding Day 🎉";
    return;
  }

  let d = Math.floor(gap / (1000*60*60*24));

  document.getElementById("timer").innerHTML =
    `<span style="font-size:2.5em;color:#b8962e;">${d}</span> Days Left`;
}, 1000);

// PETALS
function createPetal(){
  let p = document.createElement("div");
  p.className = "petal";
  p.style.left = Math.random()*100 + "vw";
  p.style.width = "15px";
  p.style.height = "15px";
  p.style.animationDuration = (4 + Math.random()*4) + "s";

  document.body.appendChild(p);
  setTimeout(()=>p.remove(), 9000);
}
setInterval(createPetal, 400);

// RSVP OPEN
function openRSVP(){
  document.getElementById("rsvpModal").style.display = "flex";
}

// CLOSE RSVP
function closeRSVP(){
  document.getElementById("rsvpModal").style.display = "none";
}

// SAVE RSVP
function submitRSVP(){
  let name = document.getElementById("name").value;
  let guests = document.getElementById("guests").value;
  let msg = document.getElementById("msg").value;

  if(!name || !guests){
    alert("Please fill details ❤️");
    return;
  }

  let data = JSON.parse(localStorage.getItem("rsvps") || "[]");

  data.push({
    name, guests, msg,
    time: new Date().toLocaleString()
  });

  localStorage.setItem("rsvps", JSON.stringify(data));

  document.getElementById("status").innerText = "Saved ❤️";

  setTimeout(closeRSVP, 1000);
}

</script>

</body>
</html>
