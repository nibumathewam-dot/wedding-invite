<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:sans-serif;
  overflow:hidden;
  background:black;
}

/* ENABLE SCROLL AFTER OPEN */
body.scroll{
  overflow:auto;
}

/* IMAGE CONTAINER */
#imageContainer{
  position:fixed;
  width:100%;
  height:100vh;
  overflow:hidden;
  z-index:1;
}

/* IMAGE */
#bgImg{
  width:100%;
  height:auto;
  display:block;

  filter:blur(15px);
  transition:2s ease;
}

/* CLEAR IMAGE */
.clear{
  filter:blur(0)!important;
}

/* TEXT */
#text{
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  color:white;
  z-index:2000;
}

/* TYPING */
.typing{
  display:inline-block;
  font-size:28px;
  white-space:nowrap;
  overflow:hidden;
  border-right:3px solid white;
  max-width:0;

  animation:
    typing 5s steps(30,end) forwards,
    blink 0.7s step-end 5,
    hideCursor 0.1s forwards 5s;
}

@keyframes typing{
  from{max-width:0}
  to{max-width:100%}
}

@keyframes blink{
  50%{border-color:transparent}
}

@keyframes hideCursor{
  to{border-right:none}
}

/* BUTTON */
#btn{
  position:absolute;
  top:62%;
  left:50%;
  transform:translateX(-50%);
  width:130px;
  height:130px;
  border-radius:50%;
  border:none;
  background:radial-gradient(circle,#ffd700,#b8962e);
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  font-size:14px;
  cursor:pointer;
  z-index:2000;
  opacity:0;
}

.showBtn{
  animation:fadeIn 1s forwards, pulse 1.6s infinite, glow 2s infinite;
}

@keyframes fadeIn{to{opacity:1;}}
@keyframes pulse{
  0%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.12);}
  100%{transform:translateX(-50%) scale(1);}
}
@keyframes glow{
  0%{box-shadow:0 0 10px #b8962e;}
  50%{box-shadow:0 0 40px #ffd700;}
  100%{box-shadow:0 0 10px #b8962e;}
}

/* DOOR */
#door{
  position:fixed;
  width:100%;
  height:100%;
  display:flex;
  z-index:1000;
  perspective:1400px;
}

.side{
  width:50%;
  height:100%;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(8px);
  transition:transform 2s ease;
}

.left{transform-origin:left;}
.right{transform-origin:right;}

.open .left{transform:rotateY(-110deg);}
.open .right{transform:rotateY(110deg);}

/* 🌹 PETALS (FIXED VISIBLE) */
#petalContainer{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:9999;
}

.petal{
  position:absolute;
  background:url('images/petal.png') center/contain no-repeat;
  opacity:0.95;
  animation:fall linear forwards;
}

@keyframes fall{
  from{transform:translateY(-10vh);}
  to{transform:translateY(110vh);}
}
</style>
</head>

<body>

<!-- IMAGE -->
<div id="imageContainer">
  <img id="bgImg" src="images/FandH.jpg">
</div>

<!-- TEXT -->
<div id="text">
  <span class="typing">You are exclusively invited 💍</span>
</div>

<!-- BUTTON -->
<button id="btn" onclick="openDoor()">
  Tap<br>to Open 💍
</button>

<!-- DOOR -->
<div id="door">
  <div class="side left"></div>
  <div class="side right"></div>
</div>

<!-- PETALS -->
<div id="petalContainer"></div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const btn=document.getElementById("btn");
const img=document.getElementById("bgImg");
const petals=document.getElementById("petalContainer");
const music=document.getElementById("music");

/* SHOW BUTTON */
setTimeout(()=>{
  btn.classList.add("showBtn");
},5200);

/* OPEN DOOR */
function openDoor(){

  btn.classList.remove("showBtn");

  document.getElementById("door").classList.add("open");

  music.play().catch(()=>{});

  img.classList.add("clear");

  document.body.classList.add("scroll");

  document.getElementById("imageContainer").style.position="relative";
  document.getElementById("imageContainer").style.height="auto";

  document.getElementById("text").style.display="none";
  btn.style.display="none";

  startPetals();

  setTimeout(()=>{
    document.getElementById("door").style.display="none";
  },2000);
}

/* ✅ CREATE SMOOTH PETAL */
function createPetal(){
  let p=document.createElement("div");
  p.className="petal";

  p.style.left=Math.random()*100+"vw";

  let size=15+Math.random()*30;
  p.style.width=size+"px";
  p.style.height=size+"px";

  let duration=5+Math.random()*4;
  p.style.animationDuration=duration+"s";

  petals.appendChild(p);

  /* ✅ REMOVE CLEANLY AFTER FALL */
  setTimeout(()=>{
    if(p.parentNode){
      p.remove();
    }
  },duration*1000);
}

/* ✅ TRUE INFINITE + NO LAG */
let petalInterval;

function startPetals(){

  if(petalInterval) return;   // ✅ prevents duplicate intervals

  petalInterval=setInterval(()=>{

    /* ✅ limit max petals (avoid lag) */
    if(petals.children.length > 60){
      return;
    }

    createPetal();

  },150);
}
</script>

</body>
</html>
