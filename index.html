<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathu ❤️ Kettiyon Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fffaf5;
  color: #333;
  overflow: hidden;
}

/* ===================== */
/* 🔥 SWIPE INTRO (IMPROVED ALIGNMENT + ANIMATION) */
/* ===================== */
#introSwipe {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  background: black;
  z-index: 10000;
}

.swipeContainer {
  display: flex;
  height: 100%;
  width: 100%;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  -webkit-overflow-scrolling: touch;
}

.card {
  flex: 0 0 100%;
  height: 100vh;
  scroll-snap-align: center;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;

  animation: fadeIn 1.2s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(1.05); }
  to { opacity: 1; transform: scale(1); }
}

.overlayCard {
  background: rgba(0,0,0,0.45);
  padding: 25px;
  border-radius: 18px;
  max-width: 80%;
  color: white;
}

.overlayCard h1 {
  font-size: 2.2em;
  margin: 0;
}

.overlayCard p {
  margin-top: 10px;
}

/* ===================== */
/* DOOR INTRO */
/* ===================== */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  z-index: 999;
  perspective: 1200px;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(5px);
  transition: transform 2s ease;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.1);
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

/* ===================== */
/* SECTIONS */
/* ===================== */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

#hero {
  background: url('images/home.jpg') center/cover no-repeat;
}

.overlay {
  background: rgba(255,255,255,0.7);
  padding: 25px;
  border-radius: 15px;
  backdrop-filter: blur(6px);
}

/* TEXT */
h1 {
  font-family: 'Playfair Display';
  color: #b8962e;
}

p {
  color: #555;
}

/* LINKS */
a {
  color: #b8962e;
  text-decoration: none;
  border: 1px solid #b8962e;
  padding: 10px 20px;
  margin-top: 10px;
  border-radius: 20px;
}

/* MUSIC BUTTON */
button {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 2000;
  background: white;
  color: #b8962e;
  border: 1px solid #b8962e;
  padding: 10px;
  border-radius: 50%;
}

/* PETALS */
.petal {
  position: fixed;
  top: -50px;
  background: url('images/petal.png') no-repeat center/contain;
  pointer-events: none;
  z-index: 1000;
  animation: fall linear forwards;
}

@keyframes fall {
  0% {
    transform: translateY(-50px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) translateX(120px) rotate(360deg);
    opacity: 0.7;
  }
}

/* BUTTON STYLE */
.rsvpBtn {
  padding: 12px 20px;
  border: 1px solid #b8962e;
  background: white;
  color: #b8962e;
  border-radius: 25px;
  font-size: 16px;
  cursor: pointer;
}

</style>
</head>

<body>

<!-- ===================== SWIPE INTRO (FIXED + ANIMATED) ===================== -->
<div id="introSwipe">
  <div class="swipeContainer">

    <div class="card" style="background:url('images/home.jpg') center/cover;">
      <div class="overlayCard">
        <h1>💍 Welcome</h1>
        <p>Swipe to continue</p>
      </div>
    </div>

    <div class="card" style="background:#b8962e;">
      <div class="overlayCard">
        <h1>Pathu ❤️ Kettiyon</h1>
        <p>Two hearts, one journey</p>
      </div>
    </div>

    <div class="card" style="background:#fffaf5;color:black;">
      <div class="overlayCard">
        <h1>Save The Date</h1>
        <p>May 26, 2026</p>
      </div>
    </div>

    <div class="card" style="background:#333;">
      <div class="overlayCard">
        <h1>📍 Venue</h1>
        <p>Bangalore Palace</p>
      </div>
    </div>

    <div class="card" style="background:#b8962e;">
      <div class="overlayCard">
        <h1>You’re Invited 💍</h1>
        <button class="rsvpBtn" onclick="enterWedding()">Enter Wedding</button>
      </div>
    </div>

  </div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button onclick="toggleMusic()">🔊</button>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
</div>

<!-- HERO -->
<section id="hero">
  <div class="overlay">
    <h1>Pathu ❤️ Kettiyon</h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE -->
<section style="background:#fff;">
  <h1>Wedding</h1>
  <p>May 26, 2026</p>

  <a href="https://maps.google.com/?q=Bangalore+Palace" target="_blank">
    View Venue 📍
  </a>
</section>

<!-- COUNTDOWN -->
<section style="background:#fffaf5;">
  <h1>Countdown</h1>
  <p id="timer"></p>
</section>

<script>

/* EXIT SWIPE */
function enterWedding(){
  document.getElementById("introSwipe").style.display = "none";
  document.body.style.overflow = "auto";
}

/* DOOR */
function openDoor() {
  document.getElementById("doorIntro").classList.add("open");
  document.getElementById("music").play().catch(()=>{});

  setTimeout(() => {
    document.getElementById("doorIntro").style.display = "none";
    document.body.style.overflow = "auto";
  }, 2000);
}

/* MUSIC */
function toggleMusic(){
  let m = document.getElementById("music");
  m.muted = !m.muted;
}

/* COUNTDOWN */
const date = new Date("May 26, 2026 00:00:00").getTime();

setInterval(() => {
  let now = new Date().getTime();
  let gap = date - now;

  if (gap <= 0) {
    document.getElementById("timer").innerHTML = "🎉 Wedding Day 🎉";
    return;
  }

  let d = Math.floor(gap / (1000*60*60*24));
  let h = Math.floor((gap / (1000*60*60)) % 24);
  let m = Math.floor((gap / (1000*60)) % 60);
  let s = Math.floor((gap / 1000) % 60);

  document.getElementById("timer").innerHTML =
    `<span style="font-size:2.5em;color:#b8962e;">${d}</span> Days<br>
     ${h}h : ${m}m : ${s}s`;
}, 1000);

/* PETALS */
function createPetal() {
  let petal = document.createElement("div");
  petal.className = "petal";

  petal.style.left = Math.random() * 100 + "vw";

  let size = 10 + Math.random()*20;
  petal.style.width = size + "px";
  petal.style.height = size + "px";

  petal.style.animationDuration = (5 + Math.random()*5) + "s";

  document.body.appendChild(petal);

  setTimeout(() => petal.remove(), 10000);
}

setInterval(createPetal, 300);

</script>

</body>
</html>
