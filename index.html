<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins';
  background: #fffaf5;
  overflow: hidden;
}

/* ================= ENVELOPE ================= */
#envelopePage {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: #6d8f5c;
  z-index: 10000;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.flap {
  position: absolute;
  width: 100%;
  height: 50%;
  top: 0;
  background: #5c7a4f;
  transform-origin: top;
  transition: transform 1.5s ease;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
}

.openEnvelope .flap {
  transform: rotateX(-180deg);
}

.seal {
  width: 90px;
  height: 90px;
  background: white;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Playfair Display';
  font-size: 22px;
  color: #b8962e;
  cursor: pointer;
  z-index: 2;
}

.invite-text {
  color: white;
  margin-top: 20px;
}

/* ================= DOOR ================= */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  z-index: 9999;
  perspective: 1200px;
  display: none;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(5px);
  transition: transform 2s ease;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.openDoor .left { transform: rotateY(-100deg); }
.openDoor .right { transform: rotateY(100deg); }

.door-text {
  position: absolute;
  width: 100%;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  color: #b8962e;
}

.door-text h1 {
  font-size: 3em;
  font-family: 'Playfair Display';
}

/* ================= SECTIONS ================= */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

#hero {
  background: url('images/home.jpg') center/cover no-repeat;
}

.overlay {
  background: rgba(255,255,255,0.7);
  padding: 25px;
  border-radius: 15px;
}

/* TEXT */
h1 {
  font-family: 'Playfair Display';
  color: #b8962e;
}

/* MUSIC */
.music {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 2000;
  border-radius: 50%;
  padding: 10px;
}

/* RSVP */
.rsvpBtn {
  padding: 12px 20px;
  border: 1px solid #b8962e;
  border-radius: 25px;
  cursor: pointer;
}

/* COUNTDOWN */
#timer {
  font-size: 2.5em;
  color: #b8962e;
}

/* PETALS */
.petal {
  position: fixed;
  top: -50px;
  width: 18px;
  height: 18px;
  background: url('images/petal.png') no-repeat center/contain;
  animation: fall linear forwards;
}

@keyframes fall {
  0% { transform: translateY(-50px); }
  100% { transform: translateY(110vh) rotate(360deg); }
}
</style>
</head>

<body>

<!-- ENVELOPE -->
<div id="envelopePage">
  <div class="flap"></div>
  <div class="seal" onclick="openEnvelope()">💍</div>
  <div class="invite-text">This invitation is exclusively for you</div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="music" onclick="toggleMusic()">🔊</button>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>

  <div class="door-text">
    <h1>Fathima 💍 Habeeb</h1>
    <p>Tap to Open</p>
  </div>
</div>

<!-- HERO -->
<section id="hero">
  <div class="overlay">
    <h1>Fathima 💍 Habeeb</h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE -->
<section>
  <h1>Wedding</h1>
  <p>May 24, 2026</p>
</section>

<!-- COUNTDOWN -->
<section>
  <h1>Countdown</h1>
  <div id="timer"></div>
  <button class="rsvpBtn" onclick="openRSVP()">RSVP 💌</button>
</section>

<script>

/* ENVELOPE OPEN */
function openEnvelope(){
  let env = document.getElementById("envelopePage");
  env.classList.add("openEnvelope");

  setTimeout(()=>{
    env.style.display="none";
    document.getElementById("doorIntro").style.display="block";
  },1500);
}

/* DOOR */
function openDoor(){
  let door = document.getElementById("doorIntro");
  door.classList.add("openDoor");

  document.getElementById("music").play().catch(()=>{});

  setTimeout(()=>{
    door.style.display="none";
    document.body.style.overflow="auto";
  },2000);
}

/* MUSIC */
function toggleMusic(){
  let m=document.getElementById("music");
  m.paused ? m.play() : m.pause();
}

/* COUNTDOWN */
const date=new Date("May 24, 2026").getTime();
setInterval(()=>{
  let now=new Date().getTime();
  let gap=date-now;

  let d=Math.floor(gap/(1000*60*60*24));
  let h=Math.floor((gap/(1000*60*60))%24);
  let m=Math.floor((gap/(1000*60))%60);
  let s=Math.floor((gap/1000)%60);

  document.getElementById("timer").innerHTML =
  `${d} Days<br>${h}:${m}:${s}`;
},1000);

/* PETALS */
setInterval(()=>{
  let p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";
  p.style.animationDuration=(4+Math.random()*4)+"s";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),8000);
},300);

/* RSVP */
function openRSVP(){
  alert("RSVP coming soon 💌");
}

</script>

</body>
</html>
