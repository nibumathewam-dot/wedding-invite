<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #e8dcc7;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: serif;
}

/* CARD CONTAINER */
.card {
  position: relative;
  width: 90vw;
  max-width: 380px;
  aspect-ratio: 3/4;
  background: url('F_H.png') center/cover no-repeat;
  border-radius: 15px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  overflow: hidden;
}

/* FLAP */
.flap {
  position: absolute;
  top: 0;
  width: 100%;
  height: 50%;
  background: url('F_H.png') center/cover no-repeat;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top;
  transition: transform 1.2s ease;
  z-index: 3;
}

/* SEAL BUTTON */
.seal {
  position: absolute;
  bottom: 30%;
  left: 50%;
  transform: translateX(-50%);
  width: 80px;
  height: 80px;
  background: gold;
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  font-size: 22px;
  cursor: pointer;
  z-index: 4;
  box-shadow: 0 5px 20px rgba(0,0,0,0.4);
}

/* INSIDE CARD */
.inner {
  position: absolute;
  bottom: -100%;
  width: 100%;
  height: 100%;
  background: white;
  border-radius: 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 20px;
  transition: bottom 1.2s ease;
  z-index: 2;
}

/* OPEN STATE */
.open .flap {
  transform: rotateX(180deg);
}

.open .inner {
  bottom: 0;
}

.open .seal {
  opacity: 0;
}
</style>
</head>

<body>

<div class="card" id="card">

  <div class="flap"></div>

  <div class="seal" onclick="openCard()">FH</div>

  <div class="inner">
    <div>
      <h2>Fathima 💍 Habeeb</h2>
      <p>Are Getting Married</p>
      <p>May 24, 2026</p>
    </div>
  </div>

</div>

<script>
function openCard() {
  document.getElementById("card").classList.add("open");
}
</script>

</body>
</html>
