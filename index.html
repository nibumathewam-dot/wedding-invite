<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<style>
body {
  margin: 0;
  height: 100vh;
  background: #e8dcc7;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: serif;
}

/* CARD CONTAINER */
.card {
  position: relative;
  width: 90vw;
  max-width: 380px;
  aspect-ratio: 3/4;
  background: url('https://raw.githubusercontent.com/nibumathewam-dot/wedding-invite/main/images/F_H.png') center/cover no-repeat;
  border-radius: 20px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  overflow: hidden;
}

/* FLAP */
.flap {
  position: absolute;
  top: 0;
  width: 100%;
  height: 50%;
  background: url('https://raw.githubusercontent.com/nibumathewam-dot/wedding-invite/main/images/F_H.png') center/cover no-repeat;
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top;
  transition: transform 1.2s ease;
  z-index: 3;
}

/* SEAL BUTTON */
.seal {
  position: absolute;
  bottom: 30%;
  left: 50%;
  transform: translateX(-50%);
  width: 85px;
  height: 85px;
  background: radial-gradient(circle, #d4af37, #b8962e);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font-weight: bold;
  font-size: 24px;
  cursor: pointer;
  z-index: 4;
  box-shadow: 0 6px 25px rgba(0,0,0,0.4);
  transition: transform 0.3s;
}

.seal:hover {
  transform: translateX(-50%) scale(1.1);
}

/* INNER CARD */
.inner {
  position: absolute;
  bottom: -100%;
  width: 100%;
  height: 100%;
  background: #fffaf5;
  border-radius: 20px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 25px;
  transition: bottom 1.2s ease;
  z-index: 2;
}

/* TEXT */
.inner h2 {
  font-size: 28px;
  color: #b8962e;
  margin-bottom: 10px;
}

.inner p {
  color: #555;
  font-size: 16px;
}

/* OPEN STATE */
.open .flap {
  transform: rotateX(180deg);
}

.open .inner {
  bottom: 0;
}

.open .seal {
  opacity: 0;
  transform: translateX(-50%) scale(0.5);
}
</style>
</head>

<body>

<div class="card" id="card">

  <!-- FLAP -->
  <div class="flap"></div>

  <!-- SEAL BUTTON -->
  <div class="seal" onclick="openCard()">FH</div>

  <!-- INNER INVITE -->
  <div class="inner">
    <div>
      <h2>Fathima 💍 Habeeb</h2>
      <p>Are Getting Married ✨</p>
      <p><b>May 24, 2026</b></p>
      <p>Bangalore Palace 📍</p>
    </div>
  </div>

</div>

<script>
function openCard() {
  document.getElementById("card").classList.add("open");
}
</script>

</body>
</html>
