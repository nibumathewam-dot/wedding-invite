<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fffaf5;
  color: #333;
  overflow: hidden; /* locked until intro finishes */
}

/* ================= DOOR INTRO ================= */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  z-index: 9999;
  perspective: 1200px;
  transition: opacity 1s;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(255,255,255,0.7);
  backdrop-filter: blur(5px);
  transition: transform 2s ease;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

/* ================= SECTIONS ================= */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
}

#hero {
  background: url('images/home.jpg') center/cover no-repeat;
}

.overlay {
  background: rgba(255,255,255,0.85);
  padding: 25px;
  border-radius: 15px;
}

/* TEXT */
h1 {
  font-family: 'Playfair Display';
  color: #b8962e;
}

/* MUSIC BUTTON */
.musicBtn {
  position: fixed;
  top: 15px;
  right: 15px;
  z-index: 20000;
  border-radius: 50%;
  padding: 10px;
  border: 1px solid #b8962e;
  background: white;
  color: #b8962e;
}

/* RSVP */
.rsvpBtn {
  padding: 12px 20px;
  border: 1px solid #b8962e;
  background: white;
  color: #b8962e;
  border-radius: 25px;
  cursor: pointer;
}

/* PETALS */
.petal {
  position: fixed;
  top: -50px;
  background: url('images/petal.png') no-repeat center/contain;
  pointer-events: none;
  animation: fall linear forwards;
  z-index: 1000;
}

@keyframes fall {
  0% { transform: translateY(-50px); opacity: 1; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0.6; }
}

/* RSVP MODAL */
#rsvpModal {
  display: none;
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 99999;
  justify-content: center;
  align-items: center;
}

.modalBox {
  background: white;
  padding: 20px;
  border-radius: 15px;
  width: 90%;
  max-width: 400px;
  text-align: center;
}

input, textarea {
  width: 90%;
  padding: 10px;
  margin: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

/* COUNTDOWN */
#timer {
  font-size: 2em;
  color: #b8962e;
  text-align: center;
}
</style>
</head>

<body>

<!-- DOOR INTRO -->
<div id="doorIntro">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button class="musicBtn" onclick="toggleMusic()">🔊</button>

<!-- HERO -->
<section id="hero">
  <div class="overlay">
    <h1>Fathima 💍 Habeeb</h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE -->
<section>
  <h1>Wedding Date</h1>
  <p>May 24, 2026</p>
</section>

<!-- LOCATION -->
<section>
  <h1>Venue 📍</h1>
  <p>Bangalore Palace Grounds</p>

  <a class="rsvpBtn" href="https://maps.google.com/?q=Bangalore+Palace" target="_blank">
    Open Maps 🗺️
  </a>
</section>

<!-- COUNTDOWN -->
<section>
  <h1>Countdown</h1>
  <p id="timer"></p>

  <button class="rsvpBtn" onclick="openRSVP()">RSVP 💌</button>
</section>

<!-- RSVP -->
<div id="rsvpModal">
  <div class="modalBox">
    <h2 style="color:#b8962e;">RSVP</h2>

    <input id="name" placeholder="Name">
    <input id="guests" type="number" placeholder="Guests">
    <textarea id="msg" placeholder="Message"></textarea>

    <button class="rsvpBtn" onclick="submitRSVP()">Submit</button>
    <p id="status"></p>

    <button onclick="closeRSVP()" style="border:none;background:none;color:red;">Close ✖</button>
  </div>
</div>

<script>

/* DOOR FIX */
function openDoor(){
  document.getElementById("doorIntro").classList.add("open");
  document.getElementById("music").play().catch(()=>{});

  setTimeout(()=>{
    document.getElementById("doorIntro").style.opacity="0";
  },1500);

  setTimeout(()=>{
    document.getElementById("doorIntro").style.display="none";

    // 🔥 RESTORE SCROLL
    document.body.style.overflow="auto";
  },2200);
}

/* MUSIC */
function toggleMusic(){
  let m=document.getElementById("music");
  m.paused ? m.play() : m.pause();
}

/* COUNTDOWN (WITH SECONDS) */
const date = new Date("May 24, 2026 00:00:00").getTime();

setInterval(() => {
  let now = new Date().getTime();
  let gap = date - now;

  let d = Math.floor(gap / (1000*60*60*24));
  let h = Math.floor((gap / (1000*60*60)) % 24);
  let m = Math.floor((gap / (1000*60)) % 60);
  let s = Math.floor((gap / 1000) % 60);

  document.getElementById("timer").innerHTML =
    `${d} Days<br>${h}h : ${m}m : ${s}s`;
}, 1000);

/* RSVP */
function openRSVP(){document.getElementById("rsvpModal").style.display="flex";}
function closeRSVP(){document.getElementById("rsvpModal").style.display="none";}

function submitRSVP(){
  let name=document.getElementById("name").value;
  let guests=document.getElementById("guests").value;

  if(!name||!guests){alert("Fill details");return;}

  let data=JSON.parse(localStorage.getItem("rsvps")||"[]");
  data.push({name,guests,time:new Date().toLocaleString()});
  localStorage.setItem("rsvps",JSON.stringify(data));

  document.getElementById("status").innerText="Saved ❤️";
  setTimeout(closeRSVP,1000);
}

/* PETALS */
function createPetal(){
  let p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";
  p.style.width="15px";
  p.style.height="15px";
  p.style.animationDuration=(4+Math.random()*4)+"s";
  document.body.appendChild(p);
  setTimeout(()=>p.remove(),9000);
}
setInterval(createPetal,400);

</script>

</body>
</html>
