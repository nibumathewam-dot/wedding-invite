<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

/* CENTER VIDEO */
.video-container {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* KEEP ORIGINAL RATIO */
video {
  max-height: 100%;
  max-width: 100%;
}
</style>

</head>

<body>

<div class="video-container">
  <video autoplay muted playsinline id="vid">
    <source src="opening.mp4" type="video/mp4">
  </video>
</div>

<script>
const vid = document.getElementById("vid");

// go next when video ends
vid.onended = function() {
  window.location.href = "details.html";
};

// backup timer (adjust if needed)
setTimeout(function(){
  window.location.href = "details.html";
}, 6000);
</script>

</body>
</html>
