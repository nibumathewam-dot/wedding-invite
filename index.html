<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding</title>

<style>
body {
  margin: 0;
  background: black;
  overflow: hidden;
}

/* CENTER VIDEO */
.video-container {
  width: 100vw;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

video {
  max-width: 100%;
  max-height: 100%;
}

/* TAP OVERLAY */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  font-size: 20px;
  background: rgba(0,0,0,0.5);
  cursor: pointer;
}
</style>

</head>

<body>

<div class="video-container">
  <video id="vid" playsinline>
    <source src="opening.mp4" type="video/mp4">
  </video>
</div>

<!-- TAP TO START -->

<div class="overlay" id="overlay">
  Tap to Open Invitation 💌
</div>

<script>
const vid = document.getElementById("vid");
const overlay = document.getElementById("overlay");

// Start video on tap
overlay.addEventListener("click", () => {
  overlay.style.display = "none";
  vid.play();
});

// Go to next page when video ends
vid.onended = function() {
  window.location.href = "details.html";
};

// Backup timer after play starts
vid.onplay = function() {
  setTimeout(function(){
    window.location.href = "details.html";
  }, 6000);
};
</script>

</body>
</html>
