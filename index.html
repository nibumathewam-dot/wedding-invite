<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pathu ❤️ Kettiyon Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: black;
  color: white;
  overflow: hidden;
}

/* DOOR INTRO */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  z-index: 999;
  perspective: 1200px;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(0,0,0,0.85);
  transition: transform 2s ease;
  box-shadow: inset 0 0 50px black;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

.door-text {
  position: absolute;
  width: 100%;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  color: gold;
}

.door-text h1 {
  font-size: 3em;
}

/* SECTIONS */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
}

/* HERO */
#hero {
  background: url('images/home.jpg') center/cover no-repeat;
}

.overlay {
  background: rgba(0,0,0,0.6);
  padding: 20px;
  border-radius: 10px;
}

/* GLOW */
h1 {
  font-family: 'Playfair Display';
  color: gold;
  animation: glow 2s infinite alternate;
}

@keyframes glow {
  from { text-shadow: 0 0 10px gold; }
  to { text-shadow: 0 0 30px gold; }
}

/* PETALS */
.petal {
  position: fixed;
  top: -50px;
  background: url('images/petal.png') no-repeat center/contain;
  pointer-events: none;
  z-index: 1000;
  animation: fall linear forwards;
}

@keyframes fall {
  0% {
    transform: translateY(-50px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) translateX(120px) rotate(360deg);
    opacity: 0.7;
  }
}

a {
  color: gold;
  text-decoration: none;
  border: 1px solid gold;
  padding: 10px 20px;
  margin-top: 10px;
}

/* MUSIC BUTTON */
button {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 2000;
  background: black;
  color: gold;
  border: 1px solid gold;
  padding: 10px;
}
</style>
</head>

<body>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button onclick="toggleMusic()">🔊</button>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
  <div class="door-text">
    <h1>
      <span style="font-size:1.4em;">Pathu</span><br>
      <span style="font-size:0.8em;">❤️</span><br>
      <span style="font-size:1.4em;">Kettiyon</span>
    </h1>
    <p>Tap to Open</p>
  </div>
</div>

<!-- HERO -->
<section id="hero">
  <div class="overlay">
    <h1>
      <span>Pathu</span><br>
      ❤️<br>
      <span>Kettiyon</span>
    </h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE -->
<section style="background:#111;">
  <h1>Wedding</h1>
  <p>May 26, 2026</p>
  <a href="https://maps.google.com/?q=Bangalore+Palace" target="_blank">
    View Venue 📍
  </a>
</section>

<!-- COUNTDOWN -->
<section style="background:black;">
  <h1>Countdown</h1>
  <p id="timer"></p>
</section>

<script>
// DOOR
function openDoor() {
  let intro = document.getElementById("doorIntro");
  intro.classList.add("open");

  document.getElementById("music").play().catch(()=>{});

  setTimeout(() => {
    intro.style.display = "none";
    document.body.style.overflow = "auto";
  }, 2000);
}

// MUSIC TOGGLE
function toggleMusic(){
  let m = document.getElementById("music");
  m.muted = !m.muted;
}

// COUNTDOWN
const date = new Date("May 26, 2026 00:00:00").getTime();

setInterval(() => {
  let now = new Date().getTime();
  let gap = date - now;

  if (gap <= 0) {
    document.getElementById("timer").innerHTML = "🎉 Wedding Day 🎉";
    return;
  }

  let d = Math.floor(gap / (1000*60*60*24));
  let h = Math.floor((gap / (1000*60*60)) % 24);
  let m = Math.floor((gap / (1000*60)) % 60);

  document.getElementById("timer").innerHTML =
    `<span style="font-size:2.5em;color:gold;">${d}</span> Days<br>
     ${h} Hours ${m} Minutes`;
}, 1000);

// PETALS
function createPetal() {
  let petal = document.createElement("div");
  petal.className = "petal";

  petal.style.left = Math.random() * 100 + "vw";

  let size = 10 + Math.random()*20;
  petal.style.width = size + "px";
  petal.style.height = size + "px";

  petal.style.animationDuration = (5 + Math.random()*5) + "s";
  petal.style.transform = `rotate(${Math.random()*360}deg)`;

  document.body.appendChild(petal);

  setTimeout(() => petal.remove(), 10000);
}

setInterval(createPetal, 300);
</script>

</body>
</html>
