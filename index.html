<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: black;
  overflow-x: hidden;
  overflow-y: hidden;
}

/* BACKGROUND SYSTEM */
.bg {
  position: relative;
  width: 100%;
  height: 100vh;
}

.bg::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: url('images/FandH.jpg') center/cover no-repeat;
  filter: blur(25px);
  transform: scale(1.1);
  z-index: 0;
}

.bg::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: url('images/FandH.jpg') center/contain no-repeat;
  z-index: 1;
}

/* INVITE INTRO */
#inviteIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  z-index: 20000;
}

.inviteContent {
  position: absolute;
  z-index: 2;
  width: 100%;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
}

.inviteText {
  color: white;
  font-size: 2em;
  white-space: nowrap;
  overflow: hidden;
  border-right: 3px solid white;
  width: 0;
  margin: auto;
  animation: typing 3s steps(30, end) forwards, blink 0.7s infinite;
}

@keyframes typing {
  from { width: 0 }
  to { width: 100% }
}

@keyframes blink {
  50% { border-color: transparent }
}

/* DOOR */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  z-index: 999;
  perspective: 1200px;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(6px);
  transition: transform 2s ease;
  z-index: 3;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

/* PETALS */
#petalContainer {
  position: fixed;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5000;
}

.petal {
  position: absolute;
  background: url('images/petal.png') no-repeat center/contain;
  animation: fall linear forwards;
}

@keyframes fall {
  0% { transform: translateY(-10vh) rotate(0deg); }
  100% { transform: translateY(110vh) rotate(360deg); }
}

/* SECTIONS */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.overlay {
  position: relative;
  z-index: 2;
  background: rgba(255,255,255,0.75);
  padding: 25px;
  border-radius: 15px;
  text-align: center;
}

h1 {
  font-family: 'Playfair Display';
  color: #b8962e;
}

/* BUTTON */
button {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 3000;
}

/* LINKS */
a {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 20px;
  border: 1px solid #b8962e;
  border-radius: 20px;
  color: #b8962e;
  text-decoration: none;
}
</style>
</head>

<body>

<!-- INVITE INTRO -->
<div id="inviteIntro" class="bg">
  <div class="inviteContent">
    <h1 class="inviteText">You are exclusively invited 💍</h1>
    <p style="color:white;margin-top:15px;">Fathima 💍 Habeeb</p>
  </div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button onclick="toggleMusic()">🔊</button>

<!-- DOOR -->
<div id="doorIntro" class="bg">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
</div>

<!-- PETALS -->
<div id="petalContainer"></div>

<!-- HERO -->
<section class="bg">
  <div class="overlay">
    <h1>Fathima 💍 Habeeb</h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE & VENUE -->
<section style="background:#fff;">
  <div class="overlay">
    <h1>Wedding</h1>
    <p>May 26, 2026</p>

    <a href="https://maps.google.com/?q=Bangalore+Palace" target="_blank">
      View Venue 📍
    </a>
  </div>
</section>

<!-- COUNTDOWN -->
<section style="background:#fffaf5;">
  <div class="overlay">
    <h1>Countdown</h1>
    <div id="timer"></div>
  </div>
</section>

<script>

/* INTRO + MUSIC */
window.addEventListener("load", () => {
  const music = document.getElementById("music");

  music.play().catch(() => {
    document.body.addEventListener("click", () => music.play(), { once: true });
  });

  setTimeout(() => {
    inviteIntro.style.opacity = "0";
    setTimeout(() => {
      inviteIntro.style.display = "none";
      document.body.style.overflowY = "auto";
      openDoor();
    }, 1000);
  }, 4000);
});

/* DOOR */
function openDoor(){
  doorIntro.classList.add("open");

  setTimeout(()=>{
    doorIntro.style.display="none";
    startPetals();
  },2000);
}

/* PETALS */
function createPetal(){
  const p = document.createElement("div");
  p.className="petal";
  p.style.left = Math.random()*100+"vw";
  let size=15+Math.random()*25;
  p.style.width=size+"px";
  p.style.height=size+"px";
  p.style.animationDuration=(3+Math.random()*3)+"s";
  petalContainer.appendChild(p);
  setTimeout(()=>p.remove(),6000);
}

function startPetals(){
  setInterval(createPetal,200);
}

/* MUSIC */
function toggleMusic(){
  music.muted=!music.muted;
}

/* COUNTDOWN (FULL) */
const date = new Date("May 26, 2026 00:00:00").getTime();

setInterval(()=>{
  let now = new Date().getTime();
  let gap = date - now;

  if (gap < 0) gap = 0;

  let days = Math.floor(gap / (1000 * 60 * 60 * 24));
  let hours = Math.floor((gap / (1000 * 60 * 60)) % 24);
  let minutes = Math.floor((gap / (1000 * 60)) % 60);
  let seconds = Math.floor((gap / 1000) % 60);

  document.getElementById("timer").innerHTML = `
    <div style="display:flex;gap:15px;justify-content:center;font-size:1.5em;color:#b8962e;">
      <div>${days}<br><small>Days</small></div>
      <div>${hours}<br><small>Hours</small></div>
      <div>${minutes}<br><small>Minutes</small></div>
      <div>${seconds}<br><small>Seconds</small></div>
    </div>
  `;
},1000);

</script>

</body>
</html>
