<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pathu ❤️ Kettiyon Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fffaf5;
  color: #333;
  overflow: hidden;
  scroll-snap-type: y mandatory;
}

/* DOOR */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  background: url('images/home.jpg') center/cover no-repeat;
  z-index: 999;
  perspective: 1200px;
  transition: opacity 1s;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(255,255,255,0.75);
  transition: transform 2s ease;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-105deg); }
.open .right { transform: rotateY(105deg); }

.door-text {
  position: absolute;
  width: 100%;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
  color: #b8962e;
}

.door-text h1 {
  font-family: 'Playfair Display';
  font-size: 2.5em;
}

/* SECTIONS */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  scroll-snap-align: start;
  text-align: center;
  padding: 20px;
}

/* HERO */
#hero {
  background: url('images/home.jpg') center/cover no-repeat;
}

.overlay {
  background: rgba(255,255,255,0.8);
  padding: 25px;
  border-radius: 15px;
}

/* TEXT */
h1 {
  font-family: 'Playfair Display';
  color: #b8962e;
}

/* FADE */
.fade {
  opacity: 0;
  transform: translateY(40px);
  transition: 1s ease;
}
.fade.show {
  opacity: 1;
  transform: translateY(0);
}

/* BUTTON */
button {
  padding: 10px 15px;
  margin-top: 10px;
  border-radius: 20px;
  border: 1px solid #b8962e;
  background: white;
  color: #b8962e;
}

/* INPUTS */
input, textarea {
  width: 80%;
  padding: 10px;
  margin: 5px;
  border: 1px solid #ccc;
  border-radius: 8px;
}

/* PETALS */
.petal {
  position: fixed;
  top: -50px;
  background: url('images/petal.png') no-repeat center/contain;
  pointer-events: none;
  animation: fall linear forwards;
  z-index: 1000;
}

@keyframes fall {
  0% { transform: translateY(-50px); opacity: 1; }
  100% { transform: translateY(110vh) rotate(360deg); opacity: 0.6; }
}

/* RSVP LIST */
#list {
  max-height: 200px;
  overflow-y: auto;
  width: 90%;
}
</style>
</head>

<body>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
  <div class="door-text">
    <h1>Pathu ❤️ Kettiyon</h1>
    <p>Tap to Enter</p>
  </div>
</div>

<!-- HERO -->
<section id="hero" class="fade">
  <div class="overlay">
    <h1>Pathu ❤️ Kettiyon</h1>
    <p>Are Getting Married ✨</p>
  </div>
</section>

<!-- DATE -->
<section class="fade">
  <h1>Wedding Date</h1>
  <p>May 26, 2026</p>
</section>

<!-- COUNTDOWN -->
<section class="fade">
  <h1>Countdown</h1>
  <p id="timer"></p>
</section>

<!-- RSVP FORM -->
<section class="fade">
  <h1>RSVP</h1>

  <input id="name" placeholder="Your Name">
  <input id="guests" type="number" placeholder="Guests">
  <textarea id="message" placeholder="Message (optional)"></textarea>

  <button onclick="submitRSVP()">Submit RSVP</button>

  <p id="status"></p>
</section>

<!-- RSVP LIST -->
<section class="fade">
  <h1>Guest List</h1>
  <button onclick="showRSVPs()">Load List</button>
  <div id="list"></div>
</section>

<script>

// OPEN DOOR
function openDoor() {
  document.getElementById("doorIntro").classList.add("open");

  setTimeout(() => {
    document.getElementById("doorIntro").style.display = "none";
    document.body.style.overflow = "auto";
  }, 2200);
}

// FADE
const faders = document.querySelectorAll(".fade");
const obs = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) e.target.classList.add("show");
  });
});
faders.forEach(el => obs.observe(el));

// COUNTDOWN
const target = new Date("May 26, 2026 00:00:00").getTime();

setInterval(() => {
  let now = new Date().getTime();
  let d = target - now;

  if (d <= 0) {
    document.getElementById("timer").innerHTML = "🎉 Wedding Day 🎉";
    return;
  }

  let days = Math.floor(d / (1000*60*60*24));
  document.getElementById("timer").innerHTML = days + " Days Left";
}, 1000);

// RSVP SAVE
function submitRSVP() {
  let name = document.getElementById("name").value;
  let guests = document.getElementById("guests").value;
  let message = document.getElementById("message").value;

  if (!name || !guests) {
    alert("Fill Name & Guests ❤️");
    return;
  }

  let data = JSON.parse(localStorage.getItem("rsvps") || "[]");

  data.push({
    name, guests, message,
    time: new Date().toLocaleString()
  });

  localStorage.setItem("rsvps", JSON.stringify(data));

  document.getElementById("status").innerText = "RSVP Saved ❤️";

  document.getElementById("name").value = "";
  document.getElementById("guests").value = "";
  document.getElementById("message").value = "";
}

// SHOW LIST
function showRSVPs() {
  let data = JSON.parse(localStorage.getItem("rsvps") || "[]");

  let html = "<ul>";

  data.forEach(r => {
    html += `<li>
      <b>${r.name}</b> (${r.guests})<br>
      ${r.message}<br>
      <small>${r.time}</small>
      <hr>
    </li>`;
  });

  html += "</ul>";

  document.getElementById("list").innerHTML = html;
}

// PETALS
function petal() {
  let p = document.createElement("div");
  p.className = "petal";
  p.style.left = Math.random()*100 + "vw";
  p.style.width = "15px";
  p.style.height = "15px";
  p.style.animationDuration = (4 + Math.random()*4) + "s";

  document.body.appendChild(p);
  setTimeout(()=>p.remove(), 9000);
}
setInterval(petal, 500);

</script>

</body>
</html>
