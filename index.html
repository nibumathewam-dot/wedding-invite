<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fathima 💍 Habeeb Wedding</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins&display=swap" rel="stylesheet">

<style>
html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: black;
  overflow-x: hidden;
  overflow-y: hidden;
}

/* BACKGROUND */
.bg {
  position: relative;
  width: 100%;
  height: 100vh;
}

.bg::before {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: url('images/FandH.jpg') center/cover no-repeat;
  filter: blur(25px);
  transform: scale(1.1);
  z-index: 0;
  transition: all 1.5s ease;
}

.bg::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: url('images/FandH.jpg') center center / contain no-repeat;
  background-color: black;
  opacity: 0;
  z-index: 1;
  transition: opacity 1.5s ease;
}

.clearView::before {
  filter: blur(0px);
  transform: scale(1);
}

.clearView::after {
  opacity: 1;
}

/* INTRO */
#inviteIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  z-index: 20000;
}

.inviteContent {
  position: absolute;
  z-index: 2;
  width: 100%;
  top: 50%;
  transform: translateY(-50%);
  text-align: center;
}

.inviteText {
  color: white;
  font-size: 2em;
  white-space: nowrap;
  overflow: hidden;
  border-right: 3px solid white;
  width: 0;
  margin: auto;
  animation: typing 3s steps(30, end) forwards, blink 0.7s infinite;
}

@keyframes typing {
  from { width: 0 }
  to { width: 100% }
}

@keyframes blink {
  50% { border-color: transparent }
}

/* DOOR */
#doorIntro {
  position: fixed;
  width: 100%;
  height: 100vh;
  z-index: 999;
  perspective: 1200px;
}

.door {
  position: absolute;
  width: 50%;
  height: 100%;
  top: 0;
  background: rgba(255,255,255,0.6);
  backdrop-filter: blur(6px);
  transition: transform 2s ease;
}

.left { left: 0; transform-origin: left; }
.right { right: 0; transform-origin: right; }

.open .left { transform: rotateY(-100deg); }
.open .right { transform: rotateY(100deg); }

/* PETALS */
#petalContainer {
  position: fixed;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5000;
}

.petal {
  position: absolute;
  background: url('images/petal.png') no-repeat center/contain;
  animation: fall linear forwards;
}

@keyframes fall {
  0% { transform: translateY(-10vh) rotate(0deg); }
  100% { transform: translateY(110vh) rotate(360deg); }
}

/* SECTIONS */
section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.overlay {
  position: relative;
  z-index: 2;
  background: rgba(255,255,255,0.75);
  padding: 25px;
  border-radius: 15px;
  text-align: center;
}

h1 {
  font-family: 'Playfair Display';
  color: #b8962e;
}

/* BUTTONS */
button {
  position: fixed;
  top: 20px;
  padding: 8px 12px;
}

#musicBtn { right: 20px; }
#skipBtn { left: 20px; }

.rsvp-btn {
  margin-top: 20px;
  padding: 12px 25px;
  background: #b8962e;
  color: white;
  border-radius: 25px;
  border: none;
  cursor: pointer;
}

</style>
</head>

<body>

<!-- INTRO -->
<div id="inviteIntro" class="bg">
  <div class="inviteContent">
    <h1 class="inviteText">You are exclusively invited 💍</h1>
    <p style="color:white;">Fathima 💍 Habeeb</p>
  </div>
</div>

<!-- MUSIC -->
<audio id="music" loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button id="musicBtn" onclick="toggleMusic()">🔊</button>
<button id="skipBtn" onclick="skipIntro()">Skip ⏩</button>

<!-- DOOR -->
<div id="doorIntro" class="bg">
  <div class="door left" onclick="openDoor()"></div>
  <div class="door right" onclick="openDoor()"></div>
</div>

<!-- PETALS -->
<div id="petalContainer"></div>

<!-- HERO -->
<section class="bg">
  <div class="overlay">
    <h1>Fathima 💍 Habeeb</h1>
    <p>Are Getting Married ✨</p>
    <button onclick="openRSVP()" class="rsvp-btn">RSVP 💌</button>
  </div>
</section>

<!-- VENUE -->
<section style="background:#fff;">
  <div class="overlay">
    <h1>Wedding</h1>
    <p>May 26, 2026</p>
    <a href="https://maps.google.com/?q=Bangalore+Palace" target="_blank">View Venue 📍</a>
  </div>
</section>

<!-- COUNTDOWN -->
<section style="background:#fffaf5;">
  <div class="overlay">
    <h1>Countdown</h1>
    <div id="timer"></div>
  </div>
</section>

<script>
const inviteIntro = document.getElementById("inviteIntro");
const doorIntro = document.getElementById("doorIntro");
const petalContainer = document.getElementById("petalContainer");
const music = document.getElementById("music");

document.body.addEventListener("click", () => {
  music.play().catch(()=>{});
}, { once: true });

window.addEventListener("load", () => {
  setTimeout(() => {
    inviteIntro.style.display = "none";
    document.body.style.overflowY = "auto";
  }, 4000);
});

/* DOOR + CLEAR IMAGE */
function openDoor(){
  doorIntro.classList.add("open");

  document.querySelectorAll(".bg").forEach(el => {
    el.classList.add("clearView");
  });

  setTimeout(()=>{
    doorIntro.style.display="none";
    startPetals();
  },2000);
}

/* RSVP */
function openRSVP(){
  window.open("rsvp.html","RSVP","width=420,height=650");
}

/* PETALS */
function createPetal(){
  const p = document.createElement("div");
  p.className="petal";
  p.style.left = Math.random()*100+"vw";
  let size=15+Math.random()*25;
  p.style.width=size+"px";
  p.style.height=size+"px";
  p.style.animationDuration=(3+Math.random()*3)+"s";
  petalContainer.appendChild(p);
  setTimeout(()=>p.remove(),6000);
}

function startPetals(){
  let interval = setInterval(createPetal,200);
  setTimeout(()=>clearInterval(interval),15000);
}

/* SKIP */
function skipIntro(){
  inviteIntro.style.display="none";
  doorIntro.style.display="none";
  document.body.style.overflowY="auto";
  startPetals();
}

/* MUSIC */
function toggleMusic(){
  music.muted = !music.muted;
}

/* COUNTDOWN */
const date = new Date("May 26, 2026").getTime();

setInterval(()=>{
  let now = new Date().getTime();
  let gap = Math.max(date - now, 0);

  let d = Math.floor(gap/(1000*60*60*24));
  let h = Math.floor((gap/(1000*60*60))%24);
  let m = Math.floor((gap/(1000*60))%60);
  let s = Math.floor((gap/1000)%60);

  document.getElementById("timer").innerHTML =
  `${d} Days ${h} Hours ${m} Min ${s} Sec`;
},1000);

</script>

</body>
</html>
