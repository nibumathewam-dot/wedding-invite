<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fathima 💍 Habeeb Wedding</title>

<style>
body{
  margin:0;
  background:black;
  overflow:hidden;
  font-family:sans-serif;
}

/* BACKGROUND */
.bg{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* ✅ FIX: ONLY ONE IMAGE VISIBLE */
.bg-blur, .bg-clear{
  position:absolute;
  width:100%;
  height:100%;
  top:0;
  left:0;
  background:url('images/FandH.jpg') center/cover no-repeat;
}

.bg-blur{
  filter:blur(20px);
  transform:scale(1.1);
  transition:1.5s ease;
  opacity:1;
}

.bg-clear{
  opacity:0;              /* ✅ hidden initially */
  transition:1.5s ease;
}

/* ✅ WHEN DOOR OPENS */
.clearView .bg-blur{
  opacity:0;              /* ✅ hide blur image */
}

.clearView .bg-clear{
  opacity:1;              /* ✅ show only clear image */
}

/* TEXT */
.inviteContent{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  width:100%;
  text-align:center;
  z-index:2;
  transition:0.6s;
}

.inviteText{
  color:white;
  font-size:clamp(1.5rem,6vw,2.5rem);
  border-right:3px solid white;
  white-space:nowrap;
  overflow:hidden;
  width:0;
  animation:typing 3s steps(30,end) forwards, blink .6s infinite;
}

@keyframes typing{
  from{width:0}
  to{width:90%}
}
@keyframes blink{
  50%{border-color:transparent}
}

/* DOOR */
#doorIntro{
  position:fixed;
  width:100%;
  height:100%;
  z-index:999;
  perspective:1500px;
}

.door{
  position:absolute;
  width:50%;
  height:100%;
  background:linear-gradient(rgba(255,255,255,0.3),rgba(255,255,255,0.1));
  backdrop-filter:blur(10px);
  box-shadow:inset -5px 0 25px rgba(0,0,0,0.6);
  transition:2s cubic-bezier(0.7,0,0.3,1);
}

.left{ left:0; transform-origin:left; }
.right{ right:0; transform-origin:right; }

.left:after,.right:after{
  content:"";
  position:absolute;
  width:2px;
  height:100%;
  background:#d4af37;
}
.left:after{right:0;}
.right:after{left:0;}

.open .left{transform:rotateY(-110deg);}
.open .right{transform:rotateY(110deg);}

/* PETALS */
#petalContainer{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
}

.petal{
  position:absolute;
  background:url('images/petal.png') center/contain no-repeat;
  animation:fall linear forwards;
}

@keyframes fall{
  0%{transform:translateY(-10vh);}
  100%{transform:translateY(110vh);}
}

/* HERO */
section{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.overlay{
  background:rgba(255,255,255,0.85);
  padding:20px;
  border-radius:15px;
  text-align:center;
}

.rsvp-btn{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#b8962e;
  color:white;
}
</style>
</head>

<body>

<!-- ✅ ONLY MUSIC (typing removed) -->
<audio id="music" loop preload="auto">
  music.mp3
</audio>

<!-- INTRO -->
<div class="bg">
  <div class="bg-blur"></div>
  <div class="bg-clear"></div>

  <div class="inviteContent">
    <h1 class="inviteText">You are exclusively invited 💍</h1>
  </div>
</div>

<!-- DOOR -->
<div id="doorIntro" class="bg">
  <div class="bg-blur"></div>
  <div class="bg-clear"></div>

  <div class="door left"></div>
  <div class="door right"></div>
</div>

<div id="petalContainer"></div>

<!-- HERO -->
<section class="bg">
  <div class="bg-blur"></div>
  <div class="bg-clear"></div>

  <div class="overlay">
    <h1>Fathima 💍 Habeeb</h1>
    <p>Are Getting Married ✨</p>
    <button onclick="openRSVP()" class="rsvp-btn">RSVP 💌</button>
  </div>
</section>

<script>
const content=document.querySelector(".inviteContent");
const door=document.getElementById("doorIntro");
const music=document.getElementById("music");
const petals=document.getElementById("petalContainer");

/* MUSIC START (mobile safe) */
document.body.addEventListener("click",()=>{
  music.play().catch(()=>{});
},{once:true});

/* FLOW */
window.onload=()=>{

  // fade text
  setTimeout(()=>{
    content.style.opacity="0";
  },3000);

  // 2 sec pause
  setTimeout(()=>{
    openDoor();
  },5000);
};

/* DOOR */
function openDoor(){
  door.classList.add("open");

  document.querySelectorAll(".bg").forEach(el=>{
    el.classList.add("clearView");
  });

  music.play().catch(()=>{});

  startPetals();

  setTimeout(()=>{
    door.style.display="none";
    document.body.style.overflow="auto";
  },2000);
}

/* PETALS */
function createPetal(){
  let p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";

  let s=15+Math.random()*20;
  p.style.width=s+"px";
  p.style.height=s+"px";

  petals.appendChild(p);
  setTimeout(()=>p.remove(),5000);
}

function startPetals(){
  let i=setInterval(createPetal,200);
  setTimeout(()=>clearInterval(i),15000);
}

function openRSVP(){
  window.open("rsvp.html","RSVP","width=420,height=650");
}
</script>

</body>
</html>
