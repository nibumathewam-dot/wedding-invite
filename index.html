<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{
  margin:0;
  overflow:hidden;
  font-family:sans-serif;
  background:black;
}

/* ✅ SINGLE BACKGROUND */
#mainBg{
  position:fixed;
  width:100%;
  height:100vh;
  background:url('images/FandH.jpg') 50% 30% / cover no-repeat;
  filter:blur(20px);
  transform:scale(1.1);
  transition:1.5s ease;
  z-index:1;
}

@media (min-width:1024px){
  #mainBg{ background-position:center top; }
}

body.clearView #mainBg{
  filter:blur(0);
  transform:scale(1);
}

/* TEXT */
.inviteContent{
  position:absolute;
  top:40%;
  width:100%;
  text-align:center;
  z-index:5;
}

.inviteText{
  color:white;
  font-size:clamp(1.5rem,6vw,2.5rem);
  border-right:3px solid white;
  white-space:nowrap;
  overflow:hidden;
  width:0;
  margin:auto;
  animation:typing 3s steps(30,end) forwards, blink .6s infinite;
}

@keyframes typing{
  from{width:0}
  to{width:90%}
}
@keyframes blink{
  50%{border-color:transparent}
}

/* ✅ TAP BUTTON */
.tapBtn{
  position:absolute;
  top:60%;
  left:50%;
  transform:translateX(-50%);
  padding:12px 25px;
  border-radius:30px;
  background:#b8962e;
  color:white;
  border:none;
  font-size:16px;
  cursor:pointer;

  opacity:0;
  transition:0.5s;

  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.1);}
  100%{transform:translateX(-50%) scale(1);}
}

/* DOOR */
#doorIntro{
  position:fixed;
  width:100%;
  height:100%;
  z-index:10;
  perspective:1500px;
}

.door{
  position:absolute;
  width:50%;
  height:100%;
  background:rgba(255,255,255,0.25);
  backdrop-filter:blur(10px);
  transition:2s ease;
}

.left{ left:0; transform-origin:left;}
.right{ right:0; transform-origin:right;}

.open .left{ transform:rotateY(-110deg);}
.open .right{ transform:rotateY(110deg);}

/* PETALS */
#petalContainer{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:20;
}

.petal{
  position:absolute;
  background:url('images/petal.png') center/contain no-repeat;
  animation:fall linear forwards;
}

@keyframes fall{
  0%{transform:translateY(-10vh);}
  100%{transform:translateY(110vh);}
}

/* HERO */
section{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.overlay{
  background:rgba(255,255,255,0.85);
  padding:20px;
  border-radius:15px;
}
</style>
</head>

<body>

<!-- BACKGROUND -->
<div id="mainBg"></div>

<!-- MUSIC -->
<audio id="music" loop>
  music.mp3
</audio>

<!-- TEXT -->
<div class="inviteContent">
  <h1 class="inviteText">You are exclusively invited 💍</h1>
</div>

<!-- ✅ TAP BUTTON -->
<button id="tapBtn" class="tapBtn" onclick="openDoor()">
  Tap to Open 💍
</button>

<!-- DOOR -->
<div id="doorIntro">
  <div class="door left"></div>
  <div class="door right"></div>
</div>

<!-- PETALS -->
<div id="petalContainer"></div>

<!-- HERO -->
<section>
  <div class="overlay">
    <h1>Fathima 💍 Habeeb</h1>
  </div>
</section>

<script>
const tapBtn=document.getElementById("tapBtn");
const door=document.getElementById("doorIntro");
const music=document.getElementById("music");
const petals=document.getElementById("petalContainer");

/* SHOW BUTTON AFTER TEXT */
window.onload=()=>{
  setTimeout(()=>{
    tapBtn.style.opacity="1";
  },3000);
};

/* CLICK → OPEN DOOR */
function openDoor(){

  tapBtn.style.display="none";

  door.classList.add("open");

  document.body.classList.add("clearView");

  music.play().catch(()=>{});

  startPetals();

  setTimeout(()=>{
    door.style.display="none";
    document.body.style.overflow="auto";
  },2000);
}

/* PETALS */
function createPetal(){
  let p=document.createElement("div");
  p.className="petal";
  p.style.left=Math.random()*100+"vw";

  let s=15+Math.random()*20;
  p.style.width=s+"px";
  p.style.height=s+"px";
  p.style.animationDuration=(3+Math.random()*3)+"s";

  petals.appendChild(p);
  setTimeout(()=>p.remove(),5000);
}

function startPetals(){
  let i=setInterval(createPetal,150);
  setTimeout(()=>clearInterval(i),15000);
}
</script>

</body>
</html>
